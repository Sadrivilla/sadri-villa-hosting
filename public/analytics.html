<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Site Analytics – Sadri Villa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e2e8f0;
  --sub:#94a3b8;
  --accent:#38bdf8;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

.header{
  padding:20px;
  font-size:22px;
  font-weight:bold;
  background:#020617;
  border-bottom:1px solid #1e293b;
}

.container{
  padding:20px;
}

/* FILTER */
.filter{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

/* CARD */
.card{
  background:var(--card);
  padding:18px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card h3{
  margin:0;
  font-size:14px;
  color:var(--sub);
}

.card h1{
  margin:5px 0 0;
  font-size:26px;
}

/* INPUT */
input{
  background:#020617;
  border:1px solid #334155;
  color:#fff;
  padding:5px;
  border-radius:6px;
}

/* BUTTON */
button{
  background:var(--accent);
  border:none;
  padding:5px 10px;
  border-radius:6px;
  cursor:pointer;
}

/* CHART */
.chart-box{
  margin-top:20px;
  background:var(--card);
  padding:20px;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="header">📊 Site Analytics</div>

<div class="container">

  <!-- FILTER -->
  <div class="filter">
    <input type="date" id="fromDate">
    <input type="date" id="toDate">
    <button onclick="loadAnalytics()">Apply</button>
  </div>

  <!-- KPI -->
  <div class="grid">
    <div class="card">
      <h3>🔴 Live Users</h3>
      <h1 id="liveUsers">0</h1>
    </div>

    <div class="card">
      <h3>Total Visits</h3>
      <h1 id="totalVisits">0</h1>
    </div>

    <div class="card">
      <h3>🏆 Top Page</h3>
      <h1 id="topPage">—</h1>
    </div>

    <div class="card">
      <h3>⏱ Avg Time</h3>
      <h1 id="avgTime">0s</h1>
    </div>
  </div>

  <!-- PAGE COUNTS -->
  <div class="grid" style="margin-top:20px;">
    <div class="card"><h3>Index</h3><h1 id="index">0</h1></div>
    <div class="card"><h3>About</h3><h1 id="about">0</h1></div>
    <div class="card"><h3>Dashboard</h3><h1 id="dashboard">0</h1></div>
    <div class="card"><h3>Profile</h3><h1 id="profile">0</h1></div>
    <div class="card"><h3>Team</h3><h1 id="team">0</h1></div>
    <div class="card"><h3>Admin</h3><h1 id="admin">0</h1></div>
    <div class="card"><h3>Shajra</h3><h1 id="shajra">0</h1></div>
    <div class="card"><h3>History</h3><h1 id="history">0</h1></div>
    <div class="card"><h3>Signup</h3><h1 id="signup">0</h1></div>
  </div>

  <!-- CHART -->
  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* 🔥 YOUR FIREBASE CONFIG */
const app = initializeApp({
  apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
  authDomain:"sadri-villa-14c06.firebaseapp.com",
  projectId:"sadri-villa-hosting"
});

const db = getFirestore(app);
const auth = getAuth(app);

/* 📊 LOAD ANALYTICS */
async function loadAnalytics(){

  const from = new Date(document.getElementById("fromDate").value).getTime();
  const to = new Date(document.getElementById("toDate").value).getTime();

  const snap = await getDocs(collection(db,"analytics_logs"));

  const counts = {};
  let total = 0;

  snap.forEach(d=>{
    const data = d.data();

    if(data.timestamp >= from && data.timestamp <= to){
      counts[data.page] = (counts[data.page] || 0) + 1;
      total++;
    }
  });

  document.getElementById("totalVisits").innerText = total;

  const pages = ["index","about","dashboard","profile","team","admin","shajra","history","signup"];

  pages.forEach(p=>{
    document.getElementById(p).innerText = counts[p] || 0;
  });

  // top page
  let top = "", max = 0;
  for(let p in counts){
    if(counts[p] > max){
      max = counts[p];
      top = p;
    }
  }
  document.getElementById("topPage").innerText = top || "-";

  renderChart(counts);
}

/* 📈 CHART */
function renderChart(counts){

  new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels:Object.keys(counts),
      datasets:[{
        label:"Page Views",
        data:Object.values(counts),
        backgroundColor:"#38bdf8"
      }]
    },
    options:{
      plugins:{ legend:{ labels:{ color:"#fff" } } },
      scales:{
        x:{ ticks:{ color:"#fff" } },
        y:{ ticks:{ color:"#fff" } }
      }
    }
  });
}

/* 🔴 LIVE USERS */
onSnapshot(collection(db,"onlineUsers"), snap=>{
  document.getElementById("liveUsers").innerText = snap.size;
});

/* ⏱ AVG TIME */
onSnapshot(collection(db,"onlineUsers"), snap=>{
  let total = 0;

  snap.forEach(d=>{
    total += (Date.now() - d.data().lastActive);
  });

  const avg = snap.size ? Math.floor(total/snap.size/1000) : 0;
  document.getElementById("avgTime").innerText = avg + "s";
});

/* 🚀 DEFAULT LOAD */
onAuthStateChanged(auth, user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const today = new Date().toISOString().split("T")[0];

  document.getElementById("fromDate").value = today;
  document.getElementById("toDate").value = today;

  loadAnalytics();
});



</script>

</body>
</html>
