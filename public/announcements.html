<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements - Sadri Villa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
font-family:'Inter',sans-serif;
background:#0f172a;
color:white;
}

.glass-card{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
}
</style>
</head>

<body>

<div class="max-w-7xl mx-auto p-6">

<div class="flex items-center justify-between mb-8">

<div>
<h1 class="text-4xl font-extrabold">
📢 Announcements
</h1>

<p class="text-slate-400 mt-2">
Latest updates from Sadri Villa
</p>
</div>

<a
href="dashboard.html"
class="bg-cyan-500 text-black px-5 py-3 rounded-2xl font-semibold">
← Dashboard
</a>

</div>

<div
id="announcementContainer"
class="grid lg:grid-cols-2 gap-6">

<div class="glass-card rounded-3xl p-6">
Loading announcements...
</div>

</div>

</div>
  <!-- IMAGE MODAL -->

<div
id="imageModal"
class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center cursor-pointer">

<button
id="closeModal"
class="absolute top-5 right-5 text-white text-4xl font-bold">
×
</button>

<button
id="prevImage"
class="absolute left-2 md:left-4 text-white text-4xl md:text-5xl px-3 md:px-4 transition">
❮
</button>

<img
id="modalImage"
src=""
class="max-w-[90%] max-h-[85vh] rounded-2xl cursor-default">

<button
id="nextImage"
class="absolute right-2 md:right-4 text-white text-4xl md:text-5xl px-3 md:px-4 transition">
❯
</button>

<div
id="imageCounter"
class="absolute bottom-6 text-white text-lg">
1 / 1
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
authDomain:"sadri-villa-14c06.firebaseapp.com",
projectId:"sadri-villa-14c06",
storageBucket:"sadri-villa-14c06.firebasestorage.app"
});

const db = getFirestore(app);
  const imageModal =
document.getElementById("imageModal");

const modalImage =
document.getElementById("modalImage");

const closeModal =
document.getElementById("closeModal");

const prevImage =
document.getElementById("prevImage");

const nextImage =
document.getElementById("nextImage");

const imageCounter =
document.getElementById("imageCounter");

let currentImages = [];

let currentIndex = 0;
  function openGallery(images,index){

currentImages = images;

currentIndex = index;

updateGallery();

imageModal.classList.remove("hidden");

}

function updateGallery(){

modalImage.src =
currentImages[currentIndex];

imageCounter.textContent =
`${currentIndex + 1} / ${currentImages.length}`;

if(currentImages.length <= 1){

prevImage.disabled = true;
nextImage.disabled = true;

prevImage.style.opacity = "0.4";
nextImage.style.opacity = "0.4";

}
else{

prevImage.disabled = false;
nextImage.disabled = false;

prevImage.style.opacity = "1";
nextImage.style.opacity = "1";

}

}

function closeGallery(){

imageModal.classList.add("hidden");

modalImage.src = "";

currentImages = [];

currentIndex = 0;

}
function showNext(){

if(
currentIndex <
currentImages.length - 1
){

currentIndex++;

}
else{

currentIndex = 0;

}

updateGallery();

}

function showPrev(){

if(currentIndex > 0){

currentIndex--;

}
else{

currentIndex =
currentImages.length - 1;

}

updateGallery();

}

async function loadAnnouncements(){


const container =
document.getElementById(
"announcementContainer"
);

const q = query(
collection(db,"announcements"),
where("enabled","==",true)
);

const snap = await getDocs(q);

let announcements=[];

snap.forEach(docSnap=>{

announcements.push({
id:docSnap.id,
...docSnap.data()
});

});

announcements.sort((a,b)=>{

if(a.pinned && !b.pinned) return -1;

if(!a.pinned && b.pinned) return 1;

return (
(b.createdAt?.seconds || 0)
-
(a.createdAt?.seconds || 0)
);

});

if(!announcements.length){

container.innerHTML=`
<div class="glass-card rounded-3xl p-6">
No announcements found.
</div>
`;

return;

}

container.innerHTML="";

announcements.forEach(item=>{

const createdDate =
item.createdAt?.toDate
? item.createdAt.toDate().toLocaleDateString("en-GB")
: "";

const card =
document.createElement("div");

card.className =
"glass-card rounded-3xl overflow-hidden h-fit";

card.innerHTML = `

${item.images?.length ? `

<div class="p-4">

<img
src="${item.images[0]}"
loading="lazy"
alt="${item.title || 'Announcement Image'}"
data-index="0"
class="announcement-image w-full h-64 object-cover rounded-xl cursor-pointer">

${item.images.length > 1 ? `
<div class="text-center text-sm text-slate-400 mt-2">
${item.images.length} Images Available
</div>
` : ''}

</div>

` : ''}

<div class="p-6">

${item.pinned ? `
<div class="mb-3">

<span class="
bg-yellow-500
text-black
px-3
py-1
rounded-full
text-xs
font-bold">

📌 Pinned

</span>

</div>
` : ''}

<h2 class="text-2xl font-bold">
${item.title || ""}
</h2>

<p class="text-slate-300 mt-4 leading-relaxed whitespace-pre-wrap">
${item.description || ""}
</p>

<p class="text-cyan-400 text-sm mt-5">
Posted: ${createdDate}
</p>

</div>

`;

container.appendChild(card);
  card
.querySelectorAll(
".announcement-image"
)
.forEach(img=>{

img.addEventListener(
"click",
()=>{

openGallery(
item.images,
Number(
img.dataset.index
)
);

}
);

});

});

}
  closeModal.addEventListener(
"click",
closeGallery
);
  imageModal.addEventListener(
"click",
(e)=>{

if(
e.target === imageModal
){

closeGallery();

}

}
);

nextImage.addEventListener(
"click",
showNext
);

prevImage.addEventListener(
"click",
showPrev
);

document.addEventListener(
"keydown",
(e)=>{

if(
imageModal.classList.contains(
"hidden"
)
) return;

if(e.key==="Escape")
closeGallery();

if(e.key==="ArrowRight")
showNext();

if(e.key==="ArrowLeft")
showPrev();

}
);

loadAnnouncements()
.catch(error=>{

console.error(error);

document.getElementById(
"announcementContainer"
).innerHTML=`
<div class="glass-card rounded-3xl p-6">
Failed to load announcements.
</div>
`;

});

</script>

</body>
</html>
