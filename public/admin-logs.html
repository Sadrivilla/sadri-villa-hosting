<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Activity Logs</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
background:#020617;
color:white;
font-family:Inter,sans-serif;
}

.glass{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
}

.activity-card{
transition:.25s;
}

.activity-card:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.08);
}
</style>
</head>

<body>

<div class="max-w-7xl mx-auto p-6">

<div class="flex items-center justify-between mb-8">

<div>
<h1 class="text-4xl font-extrabold">
📋 Admin Activity Logs
</h1>

<p class="text-slate-400 mt-2">
Complete activity history of Sadri Villa
</p>
</div>

<a
href="admin.html"
class="px-5 py-3 rounded-2xl bg-cyan-500 text-black font-semibold">
← Dashboard
</a>

</div>

<div class="glass rounded-3xl p-6 mb-6">

<input
id="searchBox"
type="text"
placeholder="Search activities..."
class="w-full bg-white/10 border border-white/10 rounded-2xl px-5 py-4 outline-none">

</div>

<div
id="activityContainer"
class="space-y-4">

<div class="glass rounded-2xl p-5">
Loading activities...
</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",

authDomain:"sadri-villa-14c06.firebaseapp.com",

projectId:"sadri-villa-14c06",

storageBucket:"sadri-villa-14c06.firebasestorage.app"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

let allActivities = [];

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

location.href =
"login.html";

return;

}

loadActivities();

}
);

async function loadActivities(){

try{

const snap =
await getDocs(
collection(
db,
"user_dashboard_activity"
)
);

allActivities = [];

snap.forEach(docSnap=>{

allActivities.push({

id:docSnap.id,
...docSnap.data()

});

});

allActivities.sort(
(a,b)=>
(b.createdAt?.seconds || 0)
-
(a.createdAt?.seconds || 0)
);

renderActivities(
allActivities
);

}catch(error){

console.error(error);

}

}

function getIcon(action){

switch(action){

case "login":
return "🔐";

case "profile_updated":
return "👤";

case "password_changed":
return "🔑";

case "announcement_added":
return "📢";

case "gallery_uploaded":
return "🖼";

default:
return "📌";

}

}

function renderActivities(data){

const container =
document.getElementById(
"activityContainer"
);

container.innerHTML = "";

if(data.length === 0){

container.innerHTML = `
<div class="glass rounded-2xl p-5">
No activity found
</div>
`;

return;

}

data.forEach(activity=>{

const card =
document.createElement("div");

card.className =
"glass rounded-2xl p-5 activity-card";

card.innerHTML = `

<div class="flex justify-between items-start">

<div>

<div class="font-bold text-lg">
${getIcon(activity.action)}
${activity.title || "Activity"}
</div>

<div class="text-slate-400 mt-1">
${activity.userName || "Unknown User"}
</div>

</div>

<div class="text-cyan-400 text-sm">
${activity.action || ""}
</div>

</div>

`;

container.appendChild(card);

});

}

document
.getElementById(
"searchBox"
)
.addEventListener(
"input",
e=>{

const value =
e.target.value.toLowerCase();

const filtered =
allActivities.filter(item=>

(item.title || "")
.toLowerCase()
.includes(value)

||

(item.userName || "")
.toLowerCase()
.includes(value)

||

(item.action || "")
.toLowerCase()
.includes(value)

);

renderActivities(
filtered
);

}
);

</script>

</body>
</html>
