<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Profile Management | Sadri Villa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>
 input[type=\"checkbox\"]{
appearance:auto !important;
-webkit-appearance:checkbox !important;
width:14px !important;
height:14px !important;
min-height:14px !important;
padding:0 !important;
margin:0 !important;
border-radius:3px !important;
accent-color:#06b6d4;
cursor:pointer;
flex-shrink:0;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#020617;
color:white;
overflow-x:hidden;
}

.glass{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

input:not([type="checkbox"]),
textarea,
select{
width:100%;
min-height:64px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.10);
color:white;
padding:20px 34px;
text-indent:4px;
border-radius:20px;
outline:none;
font-size:15px;
line-height:1.5;
}

select option{
background:#0f172a;
color:white;
}
 input[type="date"]{
color-scheme:dark;
}

select{
appearance:none;
-webkit-appearance:none;
}
  label{
display:block;
margin-bottom:10px;
font-size:14px;
font-weight:600;
color:#cbd5e1;
}

button{
cursor:pointer;
}

.loader{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
z-index:99999;
}

.loader-circle{
width:70px;
height:70px;
border-radius:50%;
border:6px solid rgba(255,255,255,0.15);
border-top:6px solid #06b6d4;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg)}
}

.member-card.active{
border:2px solid #06b6d4;
}

</style>
</head>

<body>

<div class="loader" id="loader">
<div class="loader-circle"></div>
</div>
 <!-- IMAGE MODAL -->

<div
id="imageModal"
class="fixed inset-0 bg-black/80 hidden items-center justify-center p-6 z-[999999]">

<img
id="largeImage"
class="max-w-[95vw] max-h-[90vh] rounded-[30px] object-contain">

</div>

<div class="p-4 lg:p-8 min-h-screen">

<div class="glass rounded-[32px] p-6 mb-8 flex flex-col gap-5">

<div>
  
<h1 class="text-4xl font-extrabold">
Admin Member Management
</h1>

<p class="text-slate-400 mt-2">
Manage all Sadri Villa members
</p>
</div>

<div class="flex flex-wrap gap-4">

<a
href="admin-dashboard.html"
class="bg-cyan-500 text-black px-6 py-4 rounded-2xl font-bold text-center">
Back
</a>

</div>
</div>

<div class="grid grid-cols-1 xl:grid-cols-12 gap-6">

<!-- LEFT -->

<div class="xl:col-span-4 glass rounded-[32px] p-5 h-[85vh] overflow-auto">

<div class="mb-5">
<input
id="searchInput"
type="text"
placeholder="Search member by name...">
</div>

<div id="membersWrap" class="space-y-4"></div>

</div>

<!-- RIGHT -->

<div class="xl:col-span-8 glass rounded-[32px] p-6 overflow-auto">

<div id="emptyState" class="text-center py-24 text-slate-400 text-xl">
Select member to edit
</div>

<div id="editor" style="display:none">

<div class="flex flex-col lg:flex-row gap-6 items-start mb-8">

<img
id="editPhoto"
src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
class="w-40 h-40 rounded-[30px] object-cover border-4 border-cyan-400 cursor-pointer hover:scale-105 transition">

<div class="flex-1 w-full">

<div class="grid grid-cols-1 md:grid-cols-2 gap-5">

<div>
<label>Full Name</label>
<input id="editFullName">
</div>

<div>
<label>Phone</label>

<div class="flex gap-3">

<select
id="countryCode"
class="max-w-[130px]">

<option value="+91" selected>
🇮🇳 +91
</option>

<option value="+1">
🇺🇸 +1
</option>

<option value="+971">
🇦🇪 +971
</option>

<option value="+966">
🇸🇦 +966
</option>

</select>

<input
id="editPhone"
type="tel"
maxlength="10"
inputmode="numeric"
placeholder="10 digit number">

</div>

</div>

<div>
<label>Email</label>
<input id="editEmail">
</div>

<div>
<label>Role</label>
<select id="editRole">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
</div>

<div>
<label>Approved</label>
<select id="editApproved">
<option value="true">Approved</option>
<option value="false">Pending</option>
</select>
</div>

</div>

<div class="flex flex-wrap gap-4 mt-6">

<input
id="newPhotoInput"
type="file"
accept="image/*"
class="hidden">

<button
id="changePhotoBtn"
class="bg-cyan-500 text-black px-6 py-4 rounded-2xl font-bold">
Change Profile Photo
</button>
  <button
id="uploadNewPhotoBtn"
style="display:none"
class="bg-emerald-500 text-black px-6 py-4 rounded-2xl font-bold">
Upload New Profile Photo
</button>

<button
id="deletePhotoBtn"
class="bg-red-500 px-6 py-4 rounded-2xl font-bold">
Delete Photo
</button>
<button
id="downloadPhotoBtn"
class="bg-emerald-500 text-black px-6 py-4 rounded-2xl font-bold text-center">
Download Photo
</button>

</div>

</div>

</div>
 <!-- SHAJRA LINK -->

<div class="mt-10">

<div class="flex items-center justify-between mb-5">

<h3 class="text-2xl font-bold">
Linked Shajra Member
</h3>

<button
id="removeShajraBtn"
type="button"
class="bg-red-500 px-5 py-3 rounded-2xl font-bold">
Remove Link
</button>

</div>

<div class="relative">

<input
id="shajraSearch"
type="text"
placeholder="Search lineage member...">

<div
id="shajraSuggestions"
class="absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-white/10 rounded-2xl overflow-hidden hidden z-50 max-h-[320px] overflow-y-auto">
</div>

</div>

<div
id="selectedShajraBox"
style="display:none"
class="glass rounded-2xl p-5 mt-5 border border-cyan-400/20">

<p class="text-slate-400 text-sm">
Linked Lineage Member
</p>

<h4
id="selectedShajraName"
class="text-2xl font-bold mt-2">
</h4>

</div>

</div>

<!-- ADMIN FIELDS -->

<div class="mt-10">
<h3 class="text-2xl font-bold mb-5">
Admin Fields
</h3>

<div
id="adminFieldsWrap"
class="grid grid-cols-1 md:grid-cols-2 gap-5">
</div>
</div>

<!-- CUSTOM FIELDS -->

<div class="mt-10">

<div class="flex items-center justify-between mb-5">
<h3 class="text-2xl font-bold">
Custom Fields
</h3>

<button
id="addCustomBtn"
class="bg-cyan-500 text-black px-5 py-3 rounded-2xl font-bold">
+ Add
</button>
</div>

<div id="customWrap" class="space-y-5"></div>

</div>

<!-- ACTIONS -->

<div class="flex flex-wrap gap-4 mt-10">

<button
id="saveMemberBtn"
class="bg-emerald-500 text-black px-8 py-4 rounded-2xl font-bold">
Save Changes
</button>

<button
id="deleteMemberBtn"
class="bg-red-600 px-8 py-4 rounded-2xl font-bold">
Delete Member
</button>

</div>

</div>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
query,
orderBy,
getDocs,
doc,
getDoc,
setDoc,
deleteDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytesResumable,
getDownloadURL,
deleteObject
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app=initializeApp({
apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
authDomain:"sadri-villa-14c06.firebaseapp.com",
projectId:"sadri-villa-14c06",
storageBucket:"sadri-villa-14c06.firebasestorage.app"
});

const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);

const loader=document.getElementById("loader");
const membersWrap=document.getElementById("membersWrap");
const searchInput=document.getElementById("searchInput");
  // PHONE VALIDATION

document.addEventListener("input",(e)=>{

if(e.target.id==="editPhone"){

e.target.value=e.target.value
.replace(/[^0-9]/g,'')
.slice(0,10);

}

});

let selectedUid="";
let selectedUser={};
let allUsers=[];

const urlUid =
new URLSearchParams(
location.search
).get("uid");
let allShajraMembers=[];
let selectedShajraMember=null;
  let selectedPhotoFile=null;

function showLoader(){
loader.style.display="flex";
}

function hideLoader(){
loader.style.display="none";
}

onAuthStateChanged(auth,async(user)=>{

if(!user){
location.href="login.html";
return;
}

const adminSnap=await getDoc(doc(db,"users",user.uid));

if(!adminSnap.exists()){
location.href="dashboard.html";
return;
}

const adminData=adminSnap.data();

if(adminData.role!=="admin"){
location.href="dashboard.html";
return;
}

loadMembers();

});

async function loadMembers(){

showLoader();

membersWrap.innerHTML="";

const snap=await getDocs(collection(db,"users"));
 const familySnap = await getDocs(
collection(db,"family_members")
);

allShajraMembers=[];

familySnap.forEach(docSnap=>{

allShajraMembers.push({
id:docSnap.id,
...docSnap.data()
});

});

allUsers=[];

snap.forEach(docSnap=>{

allUsers.push({
uid:docSnap.id,
...docSnap.data()
});

});

renderMembers(allUsers);

if(urlUid){

await openMember(urlUid);

}

hideLoader();

}

function renderMembers(users){

membersWrap.innerHTML="";

users.forEach(user=>{

const div=document.createElement("div");
 
div.className=
`member-card glass rounded-3xl p-4 cursor-pointer ${
user.uid === urlUid ? "active" : ""
}`;

div.innerHTML=`
<div class="flex gap-4 items-center">

<img
src="${user.profilePhoto || 'https://cdn-icons-png.flaticon.com/512/4140/4140048.png'}"
class="w-20 h-20 rounded-2xl object-cover">

<div class="flex-1">
<h3 class="font-bold text-lg">
${user.fullName || 'Member'}
</h3>

<p class="text-slate-400 text-sm mt-1">
${user.email || ''}
</p>

<div class="flex gap-2 mt-3 flex-wrap">

<div class="bg-cyan-500/20 text-cyan-300 px-3 py-1 rounded-xl text-xs">
${user.role || 'user'}
</div>

<div class="bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-xl text-xs">
${user.approved ? 'Approved' : 'Pending'}
</div>

</div>

</div>

</div>
`;

membersWrap.appendChild(div);
 if(user.uid === urlUid){

setTimeout(()=>{

div.scrollIntoView({
behavior:"smooth",
block:"center"
});

},300);

}

// OPEN MEMBER

div.onclick=()=>{

document.querySelectorAll(".member-card")
.forEach(card=>card.classList.remove("active"));

div.classList.add("active");

openMember(user.uid);

};

});

}

searchInput.oninput=()=>{

const q=searchInput.value.toLowerCase();

const filtered=allUsers.filter(u=>

`${u.fullName || ''} ${u.email || ''}`
.toLowerCase()
.includes(q)

);

renderMembers(filtered);

};

async function openMember(uid){

showLoader();

selectedUid=uid;

const snap=await getDoc(doc(db,"users",uid));

selectedUser=snap.data();

document.getElementById("emptyState").style.display="none";
document.getElementById("editor").style.display="block";
  document.getElementById("downloadPhotoBtn").href =
selectedUser.profilePhoto || "#";
 // RESTORE SHAJRA LINK

selectedShajraMember=null;

document.getElementById("selectedShajraBox")
.style.display="none";

document.getElementById("shajraSearch")
.value="";

if(selectedUser.linkedShajraMemberId){

const found = allShajraMembers.find(
m => m.id === selectedUser.linkedShajraMemberId
);

if(found){

selectedShajraMember = found;

document.getElementById("selectedShajraBox")
.style.display="block";

document.getElementById("selectedShajraName")
.innerText =
found.surname
? `${found.name} (${found.surname})`
: found.name;

document.getElementById("shajraSearch")
.value =
found.name;

}

}
  // OPEN LARGE IMAGE

document.getElementById("editPhoto").onclick=()=>{

document.getElementById("largeImage").src=
selectedUser.profilePhoto ||
'https://cdn-icons-png.flaticon.com/512/4140/4140048.png';

document.getElementById("imageModal")
.style.display="flex";

};

// BASIC

document.getElementById("editFullName").value=selectedUser.fullName || '';
const fullPhone=selectedUser.phone || "";

const codes=["+91","+1","+971","+966"];

let matchedCode="+91";

for(const code of codes){

if(fullPhone.startsWith(code)){

matchedCode=code;

break;

}

}

document.getElementById("countryCode").value=matchedCode;

document.getElementById("editPhone").value=
fullPhone.replace(matchedCode,"");

document.getElementById("editEmail").value=selectedUser.email || '';
document.getElementById("editRole").value=selectedUser.role || 'user';
document.getElementById("editApproved").value=String(selectedUser.approved);

document.getElementById("editPhoto").src=
selectedUser.profilePhoto ||
'https://cdn-icons-png.flaticon.com/512/4140/4140048.png';
  document.getElementById("downloadPhotoBtn").href =
selectedUser.profilePhoto || "#";

// ADMIN FIELDS

const adminWrap=document.getElementById("adminFieldsWrap");
adminWrap.innerHTML="";

const adminFieldsData = selectedUser.adminFields || {};

const fieldsQuery = query(
collection(db,"profileFields"),
orderBy("sequence","asc")
);

const fieldsSnap = await getDocs(fieldsQuery);

fieldsSnap.forEach((docSnap)=>{

const fieldKey = docSnap.id;

const field = docSnap.data();

if(field.visible === false) return;

const fieldValue =
adminFieldsData[fieldKey] ?? "";

let fieldHTML = "";


// TEXT

if(field.type === "text"){

fieldHTML = `
<input
data-admin="${fieldKey}"
value="${fieldValue}"
${field.required ? "required" : ""}
>
`;

}


// NUMBER

else if(field.type === "number"){

fieldHTML = `
<input
type="number"
min="0"
data-admin="${fieldKey}"
value="${fieldValue}"
${field.required ? "required" : ""}
>
`;

}


// DATE

else if(field.type === "date"){

fieldHTML = `
<input
type="date"
data-admin="${fieldKey}"
value="${fieldValue}"
${field.required ? "required" : ""}
>
`;

}


// DROPDOWN

else if(field.type === "dropdown"){

fieldHTML = `
<select
data-admin="${fieldKey}"
${field.required ? "required" : ""}
>

<option value="">
Select ${fieldKey}
</option>

${(field.options || []).map(opt => `
<option
value="${opt}"
${fieldValue === opt ? "selected" : ""}
>
${opt}
</option>
`).join("")}

</select>
`;

}


// DEFAULT

else{

fieldHTML = `
<input
data-admin="${fieldKey}"
value="${fieldValue}"
>
`;

}


adminWrap.innerHTML += `
<div>
<label>
${fieldKey}

${field.required ? `
<span class="text-red-400">*</span>
` : ""}

</label>

${fieldHTML}
</div>
`;

});

// CUSTOM FIELDS

const customWrap=document.getElementById("customWrap");
customWrap.innerHTML="";

const customFields=selectedUser.userCustomFields || {};

Object.entries(customFields).forEach(([k,v])=>{
addCustomField(k,v.value,v.showOnDashboard);
});

hideLoader();

}
function addCustomField(k='',v='',show=false){

const wrap = document.getElementById("customWrap");

const div = document.createElement("div");

div.className =
"glass rounded-3xl p-5 custom-block";

div.innerHTML = `
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">

<div>
<label>Field Name</label>
<input class="custom-key" value="${k}">
</div>

<div>
<label>Field Value</label>
<input class="custom-value" value="${v}">
</div>

</div>

<div class="flex flex-wrap gap-5 mt-5 items-center justify-between">

<label class="flex items-center gap-2 cursor-pointer select-none text-sm">

<input
type="checkbox"
class="custom-show"
${show ? 'checked' : ''}>

<span class="leading-tight">
Show On Dashboard
</span>

</label>

<button
class="bg-red-500 px-5 py-3 rounded-2xl font-bold delete-custom-btn">
Delete
</button>

</div>
`;

div.querySelector(".delete-custom-btn")
.onclick = () => div.remove();

wrap.appendChild(div);

}


// ADD CUSTOM FIELD

document.getElementById("addCustomBtn")
.onclick=()=>addCustomField();

// CHANGE PHOTO

document.getElementById("changePhotoBtn")
.onclick=()=>{
document.getElementById("newPhotoInput").click();
};
  document.getElementById("newPhotoInput")
.onchange=(e)=>{

const file=e.target.files[0];

if(!file) return;

selectedPhotoFile=file;

// PREVIEW

document.getElementById("editPhoto").src=
URL.createObjectURL(file);

// SHOW UPLOAD BUTTON

document.getElementById("uploadNewPhotoBtn")
.style.display="inline-flex";

};

  // UPLOAD NEW PHOTO

document.getElementById("uploadNewPhotoBtn")
.onclick=async()=>{

if(!selectedPhotoFile) return;

showLoader();

try{



// DELETE OLD PHOTO

if(selectedUser.profilePhoto){

try{

const oldRef=ref(
storage,
`member-dashboard-profile-photo/${selectedUid}/profile.jpg`
);

await deleteObject(oldRef);

}catch(err){
console.log(err);
}

}

// UPLOAD NEW PHOTO

const storageRef=ref(
storage,
`member-dashboard-profile-photo/${selectedUid}/profile.jpg`
);

const uploadTask=uploadBytesResumable(
storageRef,
selectedPhotoFile
);

uploadTask.on(
"state_changed",
()=>{},
(err)=>{
console.log(err);
},
async()=>{

const url=await getDownloadURL(uploadTask.snapshot.ref);

await updateDoc(
doc(db,"users",selectedUid),
{
profilePhoto:url,
updatedAt:new Date().toISOString()
}
);

selectedUser.profilePhoto=url;

document.getElementById("editPhoto").src=url;
  document.getElementById("downloadPhotoBtn").href=url;

loadMembers();
document.getElementById("uploadNewPhotoBtn")
.style.display="none";

selectedPhotoFile=null;
hideLoader();

}
);

}catch(err){
console.log(err);
hideLoader();
}

};

// DELETE PHOTO

document.getElementById("deletePhotoBtn")
.onclick=async()=>{

if(!confirm("Delete profile photo?")) return;

showLoader();

try{

const photoRef=ref(
storage,
`member-dashboard-profile-photo/${selectedUid}/profile.jpg`
);

await deleteObject(photoRef);

await updateDoc(
doc(db,"users",selectedUid),
{
profilePhoto:"",
updatedAt:new Date().toISOString()
}
);

selectedUser.profilePhoto="";

const defaultPhoto=
'https://cdn-icons-png.flaticon.com/512/4140/4140048.png';

editPhoto.src=defaultPhoto;
  document.getElementById("downloadPhotoBtn").href="#";

loadMembers();

hideLoader();

}catch(err){
console.log(err);
hideLoader();
}

};
  // DOWNLOAD PHOTO

document.getElementById("downloadPhotoBtn")
.onclick=async()=>{

if(!selectedUser.profilePhoto) return;

try{

const response=await fetch(selectedUser.profilePhoto);

const blob=await response.blob();

const blobUrl=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=blobUrl;

a.download="profile-photo.jpg";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

URL.revokeObjectURL(blobUrl);

}catch(err){

console.log(err);

}

};
const shajraSearch =
document.getElementById("shajraSearch");

const shajraSuggestions =
document.getElementById("shajraSuggestions");

shajraSearch?.addEventListener("input",()=>{

const q = shajraSearch.value
.toLowerCase()
.trim();

if(!q){

shajraSuggestions.style.display="none";

return;

}

const filtered = allShajraMembers
.filter(m =>

`${m.name || ""} ${m.surname || ""}`
.toLowerCase()
.includes(q)

)
.slice(0,20);

shajraSuggestions.innerHTML="";

filtered.forEach(member=>{

const div=document.createElement("div");

div.className=
"px-5 py-4 hover:bg-white/10 cursor-pointer border-b border-white/5";

div.innerHTML=`
<div class="font-semibold">

${member.name}

${member.surname ? `
<span class="text-slate-400">
(${member.surname})
</span>
` : ""}

</div>

<div class="text-xs text-slate-400 mt-1">
Generation ${member.generation || "-"}
</div>
`;

div.onclick=()=>{

selectedShajraMember=member;

document.getElementById("selectedShajraBox")
.style.display="block";

document.getElementById("selectedShajraName")
.innerText=
member.surname
? `${member.name} (${member.surname})`
: member.name;

shajraSearch.value=member.name;

shajraSuggestions.style.display="none";

};

shajraSuggestions.appendChild(div);

});

shajraSuggestions.style.display=
filtered.length ? "block" : "none";

});

document.addEventListener("click",(e)=>{

if(
!shajraSuggestions.contains(e.target)
&& e.target!==shajraSearch
){

shajraSuggestions.style.display="none";

}

});

document.addEventListener("keydown",(e)=>{

if(e.key==="Escape"){

shajraSuggestions.style.display="none";

}

});



document.getElementById("removeShajraBtn")
.onclick=()=>{

selectedShajraMember=null;

document.getElementById("selectedShajraBox")
.style.display="none";

document.getElementById("shajraSearch")
.value="";
 shajraSuggestions.style.display="none";

};
// SAVE MEMBER

document.getElementById("saveMemberBtn")
.onclick=async()=>{

showLoader();

try{

const adminFields={};

let hasError = false;

document.querySelectorAll("[data-admin]")
.forEach(input=>{

const value = String(input.value).trim();

if(input.required && !value){

input.style.border = "1px solid rgba(248,113,113,0.9)";
input.style.boxShadow = "0 0 0 3px rgba(248,113,113,0.15)";

hasError = true;

}else{

input.style.border = "";
input.style.boxShadow = "";

}

adminFields[input.dataset.admin] = value;

});

if(hasError){

hideLoader();

alert("Please fill all required fields");

return;

}

const customFields={};

document.querySelectorAll(".custom-block")
.forEach(block=>{

const key=block.querySelector(".custom-key").value.trim();

if(key){

customFields[key]={
value:block.querySelector(".custom-value").value.trim(),
showOnDashboard:block.querySelector(".custom-show").checked
};

}

});

await setDoc(
doc(db,"users",selectedUid),
{
fullName:document.getElementById("editFullName").value.trim(),
phone:
document.getElementById("countryCode").value +
document.getElementById("editPhone").value.trim(),
email:document.getElementById("editEmail").value.trim(),
role:document.getElementById("editRole").value,
approved:document.getElementById("editApproved").value === 'true',

linkedShajraMemberId:
selectedShajraMember?.id || "",

adminFields,
userCustomFields:customFields,
updatedAt:new Date().toISOString()
},
{merge:true}
);

alert("Member updated successfully");

loadMembers();

hideLoader();

}catch(err){
console.log(err);
hideLoader();
}

};
  // CLOSE IMAGE MODAL

document.getElementById("imageModal")
.onclick=()=>{

document.getElementById("imageModal")
.style.display="none";

};

// DELETE MEMBER

document.getElementById("deleteMemberBtn")
.onclick=async()=>{

const ok=confirm(
"Delete this member permanently?"
);

if(!ok) return;

showLoader();

try{

// DELETE PROFILE PHOTO

try{

const photoRef=ref(
storage,
`member-dashboard-profile-photo/${selectedUid}/profile.jpg`
);

await deleteObject(photoRef);

}catch(err){
console.log(err);
}

// DELETE FIRESTORE USER

await deleteDoc(
doc(db,"users",selectedUid)
);

// RESET UI

selectedUid="";
selectedUser={};

editor.style.display="none";
emptyState.style.display="block";

loadMembers();

hideLoader();

alert("Member deleted successfully");

}catch(err){
console.log(err);
hideLoader();
}

};

</script>
