<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="description" content="Login to Sadri Villa member portal for accessing dashboard, profiles and member services.">

<meta name="robots" content="index, follow, max-image-preview:large">

<link rel="canonical" href="https://sadrivilla.in/login.html">
<meta property="og:title" content="Login – Sadri Villa">
<meta property="og:description" content="Access your Sadri Villa account dashboard.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sadrivilla.in/login.html">

<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:description" content="Access your Sadri Villa account dashboard.">
<title>Login – Sadri Villa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

/* ===== PAGE BASE ===== */
body{
  font-family:Arial,sans-serif;
  background:#eef2ff;
  min-height:100vh;
  margin:0;
}

/* ===== NAVBAR (MATCH INDEX EXACTLY) ===== */
.navbar{
  position:fixed;
  top:0;left:0;right:0;
  height:50px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,0,0,.08);
  z-index:1000;
  padding:0;
}
/* HAMBURGER */
.hamburger{
  display:none;
  flex-direction:column;
  gap:5px;
  cursor:pointer;
  padding-right:20px;
}
.hamburger span{
  width:25px;
  height:3px;
  background:#081634;
  border-radius:3px;
}

/* MOBILE MENU */
.mobile-menu{
  position:fixed;
  top:50px;
  right:-100%;
  width:260px;
  height:100%;
  background:#081634;
  padding:30px;
  transition:.4s;
  display:flex;
  flex-direction:column;
  gap:20px;
  z-index:999;
}
.mobile-menu a{
  color:white;
  text-decoration:none;
  font-weight:600;
}
.mobile-menu.active{
  right:0;
}

/* RESPONSIVE */
@media(max-width:900px){
  .nav-actions{
    display:none;
  }
  .hamburger{
    display:flex;
  }

}

.brand{
  height:50px;
  display:flex;
  align-items:center;
}

.brand img{
  height:50px;
  width:auto;
  object-fit:contain;
  display:none; /* important to prevent broken flash */
}

@media(max-width:900px){
  .nav-actions{
    display:none !important;
  }
  .hamburger{
    display:flex !important;
  }
}


/* SAME STYLE AS INDEX */
.nav-actions a{
  padding:5px 20px;
  border-radius:15px;
  background:linear-gradient(135deg,#38bdf8,#60a5fa);
  color:white;
  font-weight:700;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:all .3s ease;
}

.nav-actions a:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}


/* ===== LOGIN CARD ===== */
.page-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  background:rgba(255,255,255,.95);
  padding:40px 36px;
  border-radius:24px;
  width:100%;
  max-width:420px;
  box-shadow:0 25px 60px rgba(0,0,0,.15);
  text-align:center;
}
.field{margin-bottom:18px}
.field input{
  width:100%;
  height:56px;
  padding:0 18px;
  border-radius:16px;
  border:1.5px solid #d1d5db;
  font-size:15px;
}
.password-wrap{position:relative}
.password-wrap .eye{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}
button{
  width:100%;
  height:56px;
  margin-top:14px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  color:#fff;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(56,189,248,.45);
}
.status{display:none;font-size:14px;margin-bottom:14px}
.success{color:#16a34a}
.error{color:#ef4444}
.links{margin-top:18px;font-size:14px}
.links a{
  color:#0ea5e9;
  font-weight:600;
  cursor:pointer;
  display:block;
  margin-top:6px
}
.remember{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  margin:12px 0 6px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  user-select:none;

  /* Same gradient as Login button */
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.remember input[type="checkbox"]{
  width:18px;
  height:18px;
  accent-color:#0ea5e9; /* Blue checkbox with white tick */
  cursor:pointer;
  margin:0;
  flex-shrink:0;
}

.remember span{
  line-height:1;
}

/* ===== FORGOT PASSWORD MODAL ===== */
#fpModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(4px);
  align-items:center;
  justify-content:center;
}
#fpModal .box{
  background:#fff;
  padding:28px;
  border-radius:22px;
  width:100%;
  max-width:360px;
  text-align:center
}
.villa-title{
  margin: -6px 0 22px;
  font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive;
  font-size: 34px;
  font-weight: 400;
  line-height: 1;
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 2px 8px rgba(14,165,233,0.18);
  letter-spacing: 0.5px;
}
#fpModal input{
  width:100%;
  height:52px;
  padding:0 16px;
  border-radius:14px;
  border:1.5px solid #d1d5db
}
#fpMsg{font-size:13px;margin:10px 0}
</style>
  <script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"WebPage",
  "name":"Sadri Villa Login",
  "url":"https://sadrivilla.in/login.html",
  "description":"Login page for Sadri Villa members."
}
</script>
</head>

<body>





<!-- LOGIN CARD -->
<div class="page-wrap">
  <div class="card">
    <h2>Sign in</h2>
 <h4 class="villa-title">
  <a href="/" style="text-decoration:none;color:inherit;">
    Sadri Villa
  </a>
</h4>


    <div class="status success" id="statusMsg">Checking session…</div>
    <div class="status error" id="errorMsg"></div>

    <div class="field">
      <input id="identifier" placeholder="Email or Phone number">
    </div>

    <div class="field password-wrap">
      <input id="password" type="password" placeholder="Password">
      <span class="eye" id="eye">👁</span>
    </div>

    <label class="remember">
  <input type="checkbox" id="rememberMe" checked>
  <span>Remember me</span>
</label>

    <button id="loginBtn">Login</button>

    <div class="links">
      <a href="signup.html">Sign Up</a>
      <a id="forgotLink">Forgot Password?</a>
    </div>
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div id="fpModal">
  <div class="box">
    <h3>Reset Password</h3>
    <input id="fpEmail" placeholder="Registered email">
    <div id="fpMsg"></div>
    <button id="fpSendBtn">Send Reset Link</button>
    <button onclick="closeFP()" style="background:none;color:#64748b;margin-top:8px">Cancel</button>
  </div>
</div>


<!-- 🔐 LOGIN LOGIC (UNCHANGED) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  sendPasswordResetEmail,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  collection,
  query,
  where,
  getDocs,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
  authDomain: "sadri-villa-14c06.firebaseapp.com",
  projectId: "sadri-villa-14c06"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

// Initialize services
const auth = getAuth(app);
const db = getFirestore(app);
  async function addActivityLog({

userId = "",
userName = "",

action = "",
title = "",
description = "",

module = "",
targetId = ""

}){

try{

await addDoc(
collection(db,"user_dashboard_activity"),
{
userId,
userName,

action,
title,
description,

module,
targetId,

createdAt:new Date()
}
);

}catch(error){

console.error(error);

}

}

/* DOM */
const eye = document.getElementById("eye");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const identifier = document.getElementById("identifier");
const rememberMe = document.getElementById("rememberMe");
const errorMsg = document.getElementById("errorMsg");
const statusMsg = document.getElementById("statusMsg");
const forgotLink = document.getElementById("forgotLink");
const fpModal = document.getElementById("fpModal");
const fpEmail = document.getElementById("fpEmail");
const fpMsg = document.getElementById("fpMsg");
const fpSendBtn = document.getElementById("fpSendBtn");

/* 👁 Password toggle */
eye.onclick=()=>password.type=password.type==="password"?"text":"password";

/* AUTO REDIRECT */
onAuthStateChanged(auth, async user=>{
  if(!user) return;
  const ref=doc(db,"users",user.uid);
  const snap=await getDoc(ref);
  if(!snap.exists()) return;
  if(snap.data().approved!==true){
    location.href="pending.html";return;
  }
  location.href=snap.data().role==="admin"?"admin-dashboard.html":"dashboard.html";
});

/* LOGIN */
loginBtn.onclick=async()=>{
  errorMsg.style.display="none";
  statusMsg.style.display="block";
  statusMsg.textContent="Logging in…";
  try{
    await setPersistence(auth,rememberMe.checked?browserLocalPersistence:browserSessionPersistence);
    let email=identifier.value.trim();
    if(!email.includes("@")){
      const q=query(collection(db,"users"),where("phone","==",email));
      const s=await getDocs(q);
      if(s.empty) throw 0;
      email=s.docs[0].data().email;
    }
    const cred=await signInWithEmailAndPassword(auth,email,password.value);
    const ref=doc(db,"users",cred.user.uid);
    const snap=await getDoc(ref);
    if(snap.data().approved!==true){
      await updateDoc(ref,{approvalReminder:true});
      location.href="pending.html";
      return;
    }
    await updateDoc(
ref,
{
lastLogin:new Date().toISOString()
}
);

console.log("Before Activity");

await addActivityLog({

userId:cred.user.uid,

userName:snap.data().fullName || "Member",

action:"login",

title:"User Login",

description:"Logged into dashboard",

module:"authentication",

targetId:cred.user.uid

});

console.log("After Activity");
  }catch{
    statusMsg.style.display="none";
    errorMsg.style.display="block";
    errorMsg.textContent="Invalid login credentials";
  }
};

/* FORGOT PASSWORD */
forgotLink.onclick=()=>fpModal.style.display="flex";
window.closeFP=()=>{fpModal.style.display="none";fpMsg.textContent="";};
fpSendBtn.onclick=async()=>{
  const email=fpEmail.value.trim();
  if(!email){fpMsg.style.color="#ef4444";fpMsg.textContent="Email required";return;}
  fpMsg.style.color="#0284c7";fpMsg.textContent="Sending reset link…";
  try{
    await sendPasswordResetEmail(auth,email);
    fpMsg.style.color="#16a34a";fpMsg.textContent="Reset link sent to email";
  }catch{
    fpMsg.style.color="#ef4444";fpMsg.textContent="Email not registered";
  }
};
</script>


</body>
</html>
