<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduled Reports</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-5xl mx-auto">
  <h1 class="text-4xl font-bold mb-6">📅 Scheduled Reports</h1>

  <div class="bg-white rounded-3xl shadow p-6 space-y-6">

    <div class="flex items-center justify-between border-b pb-4">
      <div>
        <h3 class="font-semibold text-lg">Daily Summary Email</h3>
        <p class="text-gray-500 text-sm">Send daily dashboard summary.</p>
      </div>
      <input type="checkbox" class="w-6 h-6" checked>
    </div>

    <div class="flex items-center justify-between border-b pb-4">
      <div>
        <h3 class="font-semibold text-lg">Weekly Audit Report</h3>
        <p class="text-gray-500 text-sm">Export audit logs every week.</p>
      </div>
      <input type="checkbox" class="w-6 h-6" checked>
    </div>

    <div class="flex items-center justify-between border-b pb-4">
      <div>
        <h3 class="font-semibold text-lg">Monthly Visitor Report</h3>
        <p class="text-gray-500 text-sm">Send traffic analytics report.</p>
      </div>
      <input type="checkbox" class="w-6 h-6">
    </div>

    <div>
      <label class="block text-sm font-medium mb-2">Recipient Emails</label>
      <textarea class="w-full border rounded-2xl p-4 h-32" placeholder="admin@example.com\nowner@example.com"></textarea>
    </div>

    <button class="px-6 py-3 bg-indigo-600 text-white rounded-2xl font-semibold">Save Settings</button>
  </div>
</div>
</body>
</html>
