<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Preview</title>

<!-- Prevent search engines from indexing this page -->
<meta name="robots" content="noindex, nofollow">

<style>
:root{
  --hero-image: none;
  --hero-position: 50% 50%;
  --profile-position: 50% 50%;
  --profile-zoom: 1;
}

*{
  box-sizing: border-box;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#ffffff;
  color:#111827;
}

/* BACK BUTTON */
.back{
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1000;
  background: rgba(15,23,42,0.75);
  color: #ffffff;
  text-decoration: none;
  padding: 10px 16px;
  border-radius: 999px;
  backdrop-filter: blur(10px);
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* HERO */
.hero{
  position: relative;
  padding: 80px 20px 40px;
  text-align: center;
  color: #ffffff;
  overflow: hidden;
  background: #0f172a;
}

.hero::before{
  content: "";
  position: absolute;
  inset: 0;
  background-image: var(--hero-image);
  background-size: cover;
  background-position: var(--hero-position);
  filter: blur(20px) brightness(0.55);
  transform: scale(1.1);
}

.hero-content{
  position: relative;
  z-index: 2;
}

/* PROFILE IMAGE */
.profile-image-wrapper{
  width: 220px;
  height: 220px;
  margin: 0 auto 20px;
  border-radius: 50%;
  overflow: hidden;
  border: 6px solid #ffffff;
  box-shadow: 0 30px 80px rgba(0,0,0,0.25);
  background: #ffffff;
}

.profile-image{
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: var(--profile-position);
  transform: scale(var(--profile-zoom));
  transform-origin: center center;
}

/* NAME / ROLE */
.name{
  margin: 0;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.2;
}

.role{
  margin-top: 10px;
  font-size: 18px;
  opacity: 0.95;
}

/* SOCIAL LINKS */
.social-links{
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.social-links a{
  display: inline-block;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,0.15);
  color: #ffffff;
  text-decoration: none;
  font-weight: 600;
  backdrop-filter: blur(10px);
}

/* CONTENT */
.content{
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

.description-block{
  background: #ffffff;
  padding: 24px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  line-height: 1.7;
}

.gallery{
  margin-bottom: 20px;
}

.gallery img{
  width: 100%;
  display: block;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.06);
}

/* FOOTER */
.footer{
  text-align: center;
  padding: 30px;
  color: #64748b;
  border-top: 1px solid #e5e7eb;
}

/* MOBILE */
@media (max-width: 768px){
  .profile-image-wrapper{
    width: 110px;
    height: 110px;
  }

  .name{
    font-size: 24px;
  }

  .role{
    font-size: 16px;
  }

  .back{
    top: 12px;
    left: 12px;
    padding: 8px 12px;
    font-size: 14px;
  }

  .description-block{
    padding: 18px;
  }
}
</style>
</head>
<body>

<a href="javascript:window.close()" class="back">← Back</a>

<section class="hero">
  <div class="hero-content">

    <div class="profile-image-wrapper" id="profileWrapper" style="display:none;">
      <img id="profileImage" class="profile-image" src="" alt="">
    </div>

    <h1 id="memberName" class="name"></h1>
    <div id="memberRole" class="role"></div>

    <div id="socialLinks" class="social-links"></div>

  </div>
</section>

<main id="content" class="content"></main>

<footer class="footer">
  Sadri Villa Team Preview
</footer>

<script>
const data = JSON.parse(
  localStorage.getItem("previewMemberData") || "{}"
);

if (!data.name) {
  document.body.innerHTML =
    "<h2 style='padding:40px;text-align:center;'>No preview data found.</h2>";
} else {
  // Name and role
  document.getElementById("memberName").textContent =
    data.name || "";

  document.getElementById("memberRole").textContent =
    data.role || "";

  // Apply custom name style
  const nameEl = document.getElementById("memberName");

  if (data.nameSize) {
    nameEl.style.fontSize = data.nameSize + "px";
  }

  if (data.nameStyle === "bold") {
    nameEl.style.fontWeight = "700";
  } else if (data.nameStyle === "elegant") {
    nameEl.style.fontFamily = "Georgia, serif";
    nameEl.style.fontWeight = "600";
  }

  // Social links
  const socialLinks = document.getElementById("socialLinks");

  const socials = [
    { url: data.facebook, label: "Facebook" },
    { url: data.instagram, label: "Instagram" },
    { url: data.linkedin, label: "LinkedIn" }
  ];

  socials.forEach(item => {
    if (item.url) {
      const a = document.createElement("a");
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = item.label;
      socialLinks.appendChild(a);
    }
  });

  // Content blocks
  const blocks = data.contentBlocks || [];

  // Profile image
  const profileBlock = blocks.find(
    b =>
      b.type === "image" &&
      b.imageType === "profile" &&
      b.url
  );

  if (profileBlock) {
    const imageUrl = profileBlock.url;
    const x = profileBlock.positionX ?? 50;
    const y = profileBlock.positionY ?? 50;
    const zoom = profileBlock.zoom ?? 1;

    const profileWrapper =
      document.getElementById("profileWrapper");

    const profileImage =
      document.getElementById("profileImage");

    profileWrapper.style.display = "block";
    profileImage.src = imageUrl;

    // Hero background image
    document.documentElement.style.setProperty(
      "--hero-image",
      `url("${imageUrl}")`
    );

    document.documentElement.style.setProperty(
      "--hero-position",
      `${x}% ${y}%`
    );

    // Circular image crop
    document.documentElement.style.setProperty(
      "--profile-position",
      `${x}% ${y}%`
    );

    document.documentElement.style.setProperty(
      "--profile-zoom",
      zoom
    );
  }

  // Render descriptions and body images
  const content =
    document.getElementById("content");

  for (const block of blocks) {

    // Text block
    if (block.type === "text" && block.text) {
      const div = document.createElement("div");
      div.className = "description-block";
      div.innerHTML = block.text;
      content.appendChild(div);
    }

    // Body image block
    if (
      block.type === "image" &&
      block.imageType !== "profile" &&
      block.url
    ) {
      const div = document.createElement("div");
      div.className = "gallery";

      div.innerHTML = `
        <img src="${block.url}" alt="">
      `;

      content.appendChild(div);
    }
  }
}
</script>

</body>
</html>
