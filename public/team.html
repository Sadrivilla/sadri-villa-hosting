        /* HEADER */

    padding-top: 10px;   /* reduce gap */

            font-family: 'Playfair Display', serif;

        .team-container {

        /* CARD */

        .team-card:hover {

            transform: translateY(-8px);
            box-shadow: 0 0 0 1px #38bdf8, 0 28px 55px rgba(56, 189, 248, .35);
        }

.team-img {
    width: 100%;
    max-height: 600px;     /* 🔥 control size */
    height: auto;          /* keep original ratio */

    object-fit: contain;   /* 🔥 NO CROPPING */

    border-radius: 14px;
    margin: 15px 0;
    transition: .4s;
    background: #f1f5f9;   /* optional: clean empty space */
}


        .role {
            color: #38bdf8;

margin: 0;
letter-spacing: .5px;

<body>


    <div class="navbar">
        <a href="index.html">Back</a>
    </div>

    <div class="header">
        <h1>Sadri Villa Historical Monument</h1>
    </div>

    <div id="teamContainer" class="team-container"></div>

    <!-- 🔥 IMAGE MODAL (PASTE HERE) -->
    <div id="imgModal" style="
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:2000;
">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

        <img id="modalImg" style="
max-width:90%;
max-height:90%;
border-radius:12px;
">

    </div>

    <script type="module">
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore,
            collection,
            query,
            orderBy,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
            authDomain: "sadri-villa-14c06.firebaseapp.com",
            projectId: "sadri-villa-14c06"
        });

        const db = getFirestore(app);
        const container = document.getElementById("teamContainer");

        const q = query(collection(db, "team"), orderBy("order"));

onSnapshot(q, (snapshot) => {
    container.innerHTML = "";

    let allData = [];


    snapshot.forEach(doc => {
        const d = doc.data();
        if (d.enabled === false) return;

        allData.push(d);

        const card = document.createElement("div");
card.className = "team-card";
card.onclick = () => {
window.location.href = "/member.html?slug=" + d.slug;
};
        let contentHTML = "";

        if (d.descriptions || d.images) {
            let max = Math.max(
                d.descriptions?.length || 0,
                d.images?.length || 0
            );

            for (let i = 0; i < max; i++) {
                let desc = d.descriptions?.[i];
                let img = d.images?.[i];

                if (desc && desc.text) {
                    contentHTML += `<div class="desc">${desc.text || ""}</div>`;
                }

                if (img) {
                    contentHTML += `<img src="${img}" alt="${d.name}" loading="lazy" class="team-img" onclick="openImage(this.src)">`;
                }
            }
        }

        card.innerHTML = `
<h3 style="
${d.nameStyle === 'bold' ? 'font-weight:700;' : ''}
${d.nameStyle === 'elegant' ? 'font-family:Playfair Display, serif;' : ''}
font-size:${d.nameSize || 20}px;
">
${d.name}
</h3>

<div class="role">${d.role || ""}</div>

${contentHTML}

<div class="social">
${d.facebook ? `<a href="${d.facebook}" target="_blank" class="fb">FB</a>`:""}
${d.instagram ? `<a href="${d.instagram}" target="_blank" class="insta">IG</a>`:""}
${d.linkedin ? `<a href="${d.linkedin}" target="_blank" class="linkedin">IN</a>`:""}
</div>
`;

        container.appendChild(card);
    });

    // 🔥 ADD THIS LINE
    updateSchema(allData);
});
        // 🔥 ADD THIS BELOW
        window.openImage = function(src) {
            if (!src) return;

            document.getElementById("modalImg").src = src;
            document.getElementById("imgModal").style.display = "flex";
        };

        document.getElementById("imgModal").onclick = function() {
            this.style.display = "none";
        };
    </script>
    <script>
function updateSchema(data){

const schema = {
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Sadri Villa",
  "url": window.location.href,
  "member": data.map(d => ({
    "@type": "Person",
    "name": d.name,
    "jobTitle": d.role || "",
    "sameAs": [
      d.facebook || "",
      d.instagram || "",
      d.linkedin || ""
    ].filter(Boolean),
    "description": (d.descriptions || [])
      .map(x => x?.text || "")
      .join(" ")
  }))
};

// remove old schema
const old = document.getElementById("schemaData");
if(old) old.remove();

// create new
const script = document.createElement("script");
script.type = "application/ld+json";
script.id = "schemaData";
script.innerHTML = JSON.stringify(schema);

document.head.appendChild(script);
}
</script>

</body>

</html>
