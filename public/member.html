<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
authDomain:"sadri-villa-14c06.firebaseapp.com",
projectId:"sadri-villa-14c06"
});

const db = getFirestore(app);

// ✅ GET SLUG FROM URL
const slug = window.location.pathname.split("/").pop();

const snap = await getDocs(collection(db,"team"));

let d = null;

snap.forEach(doc=>{
if(doc.data().slug === slug){
d = doc.data();
}
});

if(d){

document.title = d.name + " | Sadri Villa";

let html = `
<h1>${d.name}</h1>
<h3>${d.role || ""}</h3>
`;

if(d.images){
d.images.forEach(img=>{
if(img){
html += `<img src="${img}" style="max-width:300px;">`;
}
});
}

if(d.descriptions){
d.descriptions.forEach(desc=>{
if(desc?.text){
html += `<p>${desc.text}</p>`;
}
});
}

document.getElementById("member").innerHTML = html;

}else{
document.getElementById("member").innerHTML = "<h2>Member not found</h2>";
}
</script>
