<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Member | Sadri Villa</title>
<meta name="description" content="Sadri Villa Member">

<style>
body{
font-family: Arial;
margin:0;
padding:20px;
background:#f1f5f9;
}

img{
max-width:100%;
border-radius:10px;
margin:10px 0;
}
</style>
</head>

<body>

<!-- ✅ THIS IS REQUIRED -->
<div id="member"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.addEventListener("DOMContentLoaded", async () => {

const app = initializeApp({
apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
authDomain:"sadri-villa-14c06.firebaseapp.com",
projectId:"sadri-villa-14c06"
});

const db = getFirestore(app);

// GET SLUG
const slug = window.location.pathname.split("/").pop();

const container = document.getElementById("member");

if(!container){
console.error("member div not found");
return;
}

const snap = await getDocs(collection(db,"team"));

let d = null;

snap.forEach(doc=>{
if(doc.data().slug === slug){
d = doc.data();
}
});

if(d){

document.title = d.name + " | Sadri Villa";

let html = `
<h1>${d.name}</h1>
<h3>${d.role || ""}</h3>
`;

if(d.images){
d.images.forEach(img=>{
if(img){
html += `<img src="${img}">`;
}
});
}

if(d.descriptions){
d.descriptions.forEach(desc=>{
if(desc?.text){
html += `<p>${desc.text}</p>`;
}
});
}

container.innerHTML = html;

}else{
container.innerHTML = "<h2>Member not found</h2>";
}

});
</script>

</body>
</html>
