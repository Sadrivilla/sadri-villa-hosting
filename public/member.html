<title>Sadri Villa Member Profile | Fazilpur Heritage</title>
  <script>

(function() {
  try {
    const path = window.location.pathname;
    const parts = path.split("/team/");
    
    if (parts.length > 1 && parts[1]) {
      const slug = parts[1];
      const name = slug
        .replace(/-/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());

      document.title = name + " | Sadri Villa";
    }
  } catch(e) {}
})();
</script>

body{

/* NAVBAR */
.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;

z-index:1000;
}

.nav-links{
display:flex;
gap:15px;
align-items:center;
}

.nav-links a{
text-decoration:none;
padding:10px 18px;
border-radius:25px;
background:linear-gradient(135deg,#38bdf8,#60a5fa);
color:white;
font-weight:700;
transition:.3s ease;
}

.nav-links a:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(0,0,0,.15);
}

/* HERO */
.member-hero{
position:relative;
min-height:520px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
padding:100px 20px 50px;
background:#081634;
}

.hero-bg{
position:absolute;
inset:0;
background-size:cover;
background-position:center;
filter:blur(12px);
transform:scale(1.1);
opacity:.35;
}

.hero-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.45);
}

.hero-content{
position:relative;
z-index:2;
color:white;
max-width:800px;
}

.profile-img{
width:170px;
height:170px;
object-fit:cover;
border-radius:50%;
border:5px solid rgba(255,255,255,.9);
box-shadow:0 20px 40px rgba(0,0,0,.3);
margin-bottom:20px;
}

.hero-content h1{
font-size:52px;
font-family:'Playfair Display',serif;
margin-bottom:10px;
}

.hero-content p{
font-size:20px;
opacity:.95;
margin-top:12px;
}

/* MAIN CARD */
.member-wrapper{
width:100%;
max-width:1600px;
margin:-20px auto 40px;
position:relative;
z-index:5;
padding:0 10px;
}

.member-card{
background:rgba(255,255,255,.92);
backdrop-filter:blur(10px);
border-radius:30px;
padding:45px;
box-shadow:0 20px 60px rgba(0,0,0,.08);
}

/* DESCRIPTION */
.member-description p{
font-size:18px;
line-height:1.9;
color:#334155;
margin-bottom:22px;
}

/* GALLERY */
.member-gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
margin-top:40px;
align-items:start;
}

.member-gallery img{
width:100%;
height:auto;
display:block;
object-fit:cover;
background:linear-gradient(135deg,#f8fafc,#e2e8f0);
border-radius:20px;
transition:.35s ease;
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.member-gallery img:hover{
  box-shadow:0 20px 40px rgba(56,189,248,.25);
transform:translateY(-5px) scale(1.02);
}

/* SHARE BUTTONS */
.share-buttons{
margin-top:40px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

.share-buttons a{
text-decoration:none;
padding:12px 20px;
border-radius:30px;
background:#081634;
color:white;
font-weight:700;
transition:.3s ease;
}

.share-buttons a:hover{
background:#38bdf8;
}

/* FOOTER */
footer{
background:#081634;
color:white;
padding:60px 20px 20px;
margin-top:80px;
}

.footer-container{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:40px;
}
.footer-col{
display:flex;
flex-direction:column;
gap:6px;
}

.footer-logo{
height:60px;
object-fit:contain;
margin-bottom:15px;
display:block;
}

.footer-container h4{
margin-bottom:15px;
}

.footer-container a,
.footer-container p{
color:#cbd5e1;
text-decoration:none;
line-height:1.8;
}

.footer-bottom{
text-align:center;
margin-top:40px;
padding-top:20px;
border-top:1px solid rgba(255,255,255,.1);
color:#94a3b8;
}

/* MOBILE */
@media(max-width:768px){

.hero-content h1{
font-size:34px;
}

.profile-img{
width:130px;
height:130px;
}

.member-card{
padding:25px;
}

.nav-links{
gap:8px;
}

.nav-links a{
padding:8px 12px;
font-size:14px;
}

}

</style>

<!-- ✅ THIS IS REQUIRED -->
<main id="member">
  <h1>Sadri Villa Member</h1>
  <p>Loading member details...</p>

  <!-- SEO fallback content -->
  <noscript>
    <h2>Sadri Villa Family Member</h2>
    <p>This page contains information about members of Sadri Villa Fazilpur heritage.</p>
  </noscript>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.addEventListener("DOMContentLoaded", async () => {

const app = initializeApp({
apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
authDomain:"sadri-villa-14c06.firebaseapp.com",
projectId:"sadri-villa-14c06"
});
const db = getFirestore(app);

// GET SLUG
const container = document.getElementById("member");

if(!container){
  console.error("member div not found");
  return;
}

// preload content AFTER check


const pathParts = window.location.pathname.split("/").filter(Boolean);
let slug = pathParts[1]; // for /team/safwan-sadri

// fallback (old URL support)
if(!slug){
  const urlParams = new URLSearchParams(window.location.search);
  slug = urlParams.get("slug");
}

if(!slug){
  container.innerHTML = "<h2>Invalid member URL</h2>";
  return;
}


let snap;

try {
  const q = query(collection(db,"team"), where("slug", "==", slug));
  snap = await getDocs(q);
} catch (e) {
  console.error(e);
  container.innerHTML = "<h2>Error loading member</h2>";
  return;
}


let d = null;

if (!snap.empty) {
  d = snap.docs[0].data();
}

if(d){

document.title = d.name + " | Sadri Villa";
  // canonical
  // ✅ Dynamic Meta
  const canonicalUrl = "https://sadrivilla.in/team/" + slug;
document.getElementById("canonicalLink")?.setAttribute("href", canonicalUrl);
const descText = (d.descriptions || [])
  .map(x => x?.text || "")
  .join(" ")
  .replace(/<[^>]+>/g, "")
  .slice(0,150) || "Sadri Villa Member";

// meta description
document.querySelector('meta[name="description"]')?.setAttribute("content", descText);

// OpenGraph
document.querySelector('meta[property="og:title"]')?.setAttribute("content", d.name + " | Sadri Villa");
document.querySelector('meta[property="og:description"]')?.setAttribute("content", descText);
const mainImage = d.images?.find(img => img) || "https://sadrivilla.in/favicon.png";
  
document.querySelector('meta[property="og:image"]')?.setAttribute("content", mainImage);
document.querySelector('meta[name="twitter:image"]')?.setAttribute("content", mainImage);
document.getElementById("ogUrl")?.setAttribute("content", canonicalUrl);

// Twitter
document.querySelector('meta[name="twitter:title"]')?.setAttribute("content", d.name + " | Sadri Villa");
document.querySelector('meta[name="twitter:description"]')?.setAttribute("content", descText);

let html = `

<section class="member-hero">

<div class="hero-bg"
style="background-image:url('${mainImage}')">
</div>

<div class="hero-overlay"></div>

<div class="hero-content">

<img
class="profile-img"
src="${mainImage}"
alt="${d.name}">

<h1>${d.name}</h1>

<p>${d.role || "Sadri Villa Member"}</p>

</div>
</section>

<div class="member-wrapper">

<div class="member-card">

<div class="member-description">
`;



if(d.descriptions){
d.descriptions.forEach(desc=>{
if(desc?.text){
html += `<p>${desc.text}</p>`;
}
});
}
  if(d.images){

html += `<div class="member-gallery">`;

d.images.forEach(img=>{

if(img){

html += `
<img
src="${img}"
alt="${d.name}"
loading="lazy"
decoding="async">
`;

}

});

html += `</div>`;
}
  html += `

<div class="share-buttons">

<a target="_blank"
href="https://api.whatsapp.com/send?text=${encodeURIComponent(canonicalUrl)}">
WhatsApp
</a>

<a target="_blank"
href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(canonicalUrl)}">
Facebook
</a>

<a target="_blank"
href="https://twitter.com/intent/tweet?url=${encodeURIComponent(canonicalUrl)}">
Twitter/X
</a>

</div>

</div>
</div>

<footer>
  <div class="footer-container">

    <div class="footer-col">
      <img id="footerLogo" class="footer-logo">

      <p>
        150+ years of heritage, compassion &
        community service.
      </p>
    </div>

    <div class="footer-col">
      <h4>Quick Links</h4>

      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
    </div>

    <div class="footer-col">
      <h4>Near Us</h4>

      <a href="https://maps.app.goo.gl/PTyPhUnafXD2xgxcA" target="_blank">
        Mosque
      </a>

      <a href="https://maps.app.goo.gl/P6fXKqgPnXYKYXPe7" target="_blank">
        Clinic
      </a>

      <a href="https://maps.app.goo.gl/KMxLCyrREXyiy7Jv7" target="_blank">
        Super Market
      </a>

      <a href="https://maps.app.goo.gl/X66PzhR31MWzHMiX8" target="_blank">
        College
      </a>
    </div>

    <div class="footer-col">

      <h4>Contact</h4>

      <p>📍 Fazilpur, Samastipur</p>

      <p>
        📧
        <a href="mailto:sadrivillafazilpur@gmail.com">
          sadrivillafazilpur@gmail.com
        </a>
      </p>

      <p>
        📞
        <a href="tel:+918708868221">
          +91 8708868221
        </a>
      </p>

      <a href="https://maps.google.com?q=Sadri+Villa+Fazilpur" target="_blank">
        🗺️ Villa Map
      </a>

    </div>

  </div>

  <div class="footer-bottom">
    © 2026 Sadri Villa Fazilpur
  </div>
</footer>
`;
// ✅ ADD SCHEMA (SEO BOOST)
const schema = {
  "@context": "https://schema.org",
  "@type": "Person",
  "name": d.name,
  "jobTitle": d.role || "",
  "description": descText,
  "image": mainImage,
"url": canonicalUrl
};

// remove old schema if exists
const oldSchema = document.getElementById("schemaData");
if(oldSchema) oldSchema.remove();

// create new schema
const script = document.createElement("script");
script.type = "application/ld+json";
script.id = "schemaData";
script.innerHTML = JSON.stringify(schema);

container.innerHTML = html;
  const settingsSnap = await getDoc(doc(db,"siteSettings","home"));

if(settingsSnap.exists()){

const settings = settingsSnap.data();

if(settings.logo?.url){

const footerLogo = document.getElementById("footerLogo");

if(footerLogo){
footerLogo.src = settings.logo.url;
}

}

}
  document.head.appendChild(script);

// add schema AFTER render
}else{

container.innerHTML = `
  <h1>Sadri Villa Family Member</h1>
  <p>Member profile page of Sadri Villa heritage.</p>
  <a href="/team.html">← View All Members</a>
`;

}

});
</script>

</body>
</html>
