<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sadri Villa Member Profile | Fazilpur Heritage</title>
  <script>

(function() {
  try {
    const path = window.location.pathname;
    const parts = path.split("/team/");
    
    if (parts.length > 1 && parts[1]) {
      const slug = parts[1];
      const name = slug
        .replace(/-/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());

      document.title = name + " | Sadri Villa";
    }
  } catch(e) {}
})();
</script>
  <meta property="og:type" content="profile">
  <meta name="googlebot" content="index, follow, max-image-preview:large">
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="Sadri Villa">
<link rel="canonical" href="https://sadrivilla.in/team/" id="canonicalLink" />
  <link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<meta name="description" content="Explore members of Sadri Villa Fazilpur family heritage." />

<meta property="og:title" content="Sadri Villa Members">
<meta property="og:description" content="Explore members of Sadri Villa Fazilpur heritage.">
<meta property="og:image" content="https://sadrivilla.in/favicon.png">
<meta property="og:url" content="https://sadrivilla.in/team/" id="ogUrl" />

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sadri Villa Members">
<meta name="twitter:description" content="Explore members of Sadri Villa Fazilpur heritage.">
<meta name="twitter:image" content="https://sadrivilla.in/favicon.png">

<style>
body{
font-family: Arial;
margin:0;
padding:20px;
background:#f1f5f9;
}

img{
max-width:100%;
border-radius:10px;
margin:10px 0;
}
</style>
</head>

<body>

<!-- ✅ THIS IS REQUIRED -->
<main id="member">
  <h1>Sadri Villa Member</h1>
  <p>Loading member details...</p>

  <!-- SEO fallback content -->
  <noscript>
    <h2>Sadri Villa Family Member</h2>
    <p>This page contains information about members of Sadri Villa Fazilpur heritage.</p>
  </noscript>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.addEventListener("DOMContentLoaded", async () => {

const app = initializeApp({
apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
authDomain:"sadri-villa-14c06.firebaseapp.com",
projectId:"sadri-villa-14c06"
});

const db = getFirestore(app);

// GET SLUG
const container = document.getElementById("member");

if(!container){
  console.error("member div not found");
  return;
}

// preload content AFTER check


const pathParts = window.location.pathname.split("/").filter(Boolean);
let slug = pathParts[1]; // for /team/safwan-sadri

// fallback (old URL support)
if(!slug){
  const urlParams = new URLSearchParams(window.location.search);
  slug = urlParams.get("slug");
}

if(!slug){
  container.innerHTML = "<h2>Invalid member URL</h2>";
  return;
}


let snap;

try {
  const q = query(collection(db,"team"), where("slug", "==", slug));
  snap = await getDocs(q);
} catch (e) {
  console.error(e);
  container.innerHTML = "<h2>Error loading member</h2>";
  return;
}


let d = null;

if (!snap.empty) {
  d = snap.docs[0].data();
}

if(d){

document.title = d.name + " | Sadri Villa";
  // canonical
  // ✅ Dynamic Meta
  const canonicalUrl = "https://sadrivilla.in/team/" + slug;
document.getElementById("canonicalLink")?.setAttribute("href", canonicalUrl);
const descText = (d.descriptions || [])
  .map(x => x?.text || "")
  .join(" ")
  .replace(/<[^>]+>/g, "")
  .slice(0,150) || "Sadri Villa Member";

// meta description
document.querySelector('meta[name="description"]')?.setAttribute("content", descText);

// OpenGraph
document.querySelector('meta[property="og:title"]')?.setAttribute("content", d.name + " | Sadri Villa");
document.querySelector('meta[property="og:description"]')?.setAttribute("content", descText);
const mainImage = d.images?.find(img => img) || "https://sadrivilla.in/favicon.png";
  
document.querySelector('meta[property="og:image"]')?.setAttribute("content", mainImage);
document.querySelector('meta[name="twitter:image"]')?.setAttribute("content", mainImage);
document.getElementById("ogUrl")?.setAttribute("content", canonicalUrl);

// Twitter
document.querySelector('meta[name="twitter:title"]')?.setAttribute("content", d.name + " | Sadri Villa");
document.querySelector('meta[name="twitter:description"]')?.setAttribute("content", descText);

let html = `
<h1>${d.name}</h1>
<h2>${d.role || ""}</h2>
<p><strong>Sadri Villa, Fazilpur</strong></p>
`;

if(d.images){
d.images.forEach(img=>{
if(img){
html += `<img src="${img}" alt="${d.name} Sadri Villa member" loading="lazy">`;
}
});
}

if(d.descriptions){
d.descriptions.forEach(desc=>{
if(desc?.text){
html += `<p>${desc.text}</p>`;
}
});
}
// ✅ ADD SCHEMA (SEO BOOST)
const schema = {
  "@context": "https://schema.org",
  "@type": "Person",
  "name": d.name,
  "jobTitle": d.role || "",
  "description": descText,
  "image": mainImage,
"url": canonicalUrl
};

// remove old schema if exists
const oldSchema = document.getElementById("schemaData");
if(oldSchema) oldSchema.remove();

// create new schema
const script = document.createElement("script");
script.type = "application/ld+json";
script.id = "schemaData";
script.innerHTML = JSON.stringify(schema);

container.innerHTML = html;
  document.head.appendChild(script);

// add schema AFTER render
}else{

container.innerHTML = `
  <h1>Sadri Villa Family Member</h1>
  <p>Member profile page of Sadri Villa heritage.</p>
  <a href="/team.html">← View All Members</a>
`;

}

});
</script>

</body>
</html>
