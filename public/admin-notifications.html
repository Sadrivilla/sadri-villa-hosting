<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notification Management | Sadri Villa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:'Inter',sans-serif;
}

.glass{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
}

</style>

</head>

<body>

<div class="max-w-7xl mx-auto p-6">

<h1 class="text-4xl font-extrabold mb-2">
Notification Management
</h1>

<p class="text-slate-400 mb-8">
Send push notifications to Sadri Villa members.
</p>

<div class="glass rounded-3xl p-8">

<h2 class="text-2xl font-bold mb-6">
Create Notification
</h2>

<div class="grid md:grid-cols-2 gap-6">

<div>

<label class="block mb-2 font-semibold">
Recipient
</label>

<select
id="recipient"
class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3">

<option value="all">📢 All Users</option>

</select>

</div>

<div>

<label class="block mb-2 font-semibold">
Click URL
</label>

<input
id="url"
type="text"
value="/dashboard.html"
class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3">

</div>

</div>

<div class="mt-6">

<label class="block mb-2 font-semibold">
Notification Title
</label>

<input
id="title"
type="text"
placeholder="Notification title..."
class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3">

</div>

<div class="mt-6">

<label class="block mb-2 font-semibold">
Message
</label>

<textarea
id="message"
rows="5"
placeholder="Write your notification..."
class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3"></textarea>

</div>

<div class="mt-8">

<button
id="sendBtn"
class="bg-cyan-500 hover:bg-cyan-600 px-8 py-3 rounded-xl font-bold">

🔔 Send Notification

</button>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
getFunctions,
httpsCallable
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-functions.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

const functions = getFunctions(app);

const sendPushNotification = httpsCallable(
functions,
"sendPushNotification"
);

const recipientSelect =
document.getElementById("recipient");

async function loadUsers(){

recipientSelect.innerHTML =
'<option value="all">📢 All Users</option>';

const snap = await getDocs(collection(db,"users"));

snap.forEach(doc=>{

const user = doc.data();

if(
!user.fcmToken ||
user.notificationsEnabled===false
){
return;
}

const option =
document.createElement("option");

option.value = doc.id;

option.textContent =
`${user.fullName || "Unknown User"} (${user.role || "user"})`;

recipientSelect.appendChild(option);

});

}

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";

return;

}

await loadUsers();

});

window.db=db;
window.sendPushNotification=sendPushNotification;
  // ===============================
// Send Notification
// ===============================

document
.getElementById("sendBtn")
.addEventListener("click", async () => {

const recipient =
document.getElementById("recipient").value;

const title =
document.getElementById("title").value.trim();

const message =
document.getElementById("message").value.trim();

const url =
document.getElementById("url").value.trim();

if(!title){

alert("Enter notification title.");

return;

}

if(!message){

alert("Enter notification message.");

return;

}

try{

const btn=document.getElementById("sendBtn");

btn.disabled=true;

btn.innerHTML="Sending...";

if(recipient==="all"){

const snap=await getDocs(collection(db,"users"));

let sent=0;

for(const docSnap of snap.docs){

const user=docSnap.data();

if(
!user.fcmToken ||
user.notificationsEnabled===false
){
continue;
}

try{

await sendPushNotification({

token:user.fcmToken,

title:title,

body:message,

url:url

});

sent++;

}catch(err){

console.error(err);

}

}

alert(`Notification sent to ${sent} users.`);

}else{

const snap=await getDocs(collection(db,"users"));

let token="";

snap.forEach(doc=>{

if(doc.id===recipient){

token=doc.data().fcmToken;

}

});

if(!token){

alert("User has no FCM token.");

btn.disabled=false;

btn.innerHTML="🔔 Send Notification";

return;

}

await sendPushNotification({

token:token,

title:title,

body:message,

url:url

});

alert("Notification sent successfully.");

}

btn.disabled=false;

btn.innerHTML="🔔 Send Notification";

}catch(error){

console.error(error);

alert(error.message);

document.getElementById("sendBtn").disabled=false;

document.getElementById("sendBtn").innerHTML="🔔 Send Notification";

}

});

</script>

</body>
</html>
