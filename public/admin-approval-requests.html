<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pending Approval Requests – Sadri Villa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">

<style>
/* ===== RESET ===== */
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background:linear-gradient(135deg,#eef2ff 0%, #f5f3ff 100%);
  color:#1f2937;
  min-height:100vh;
}

/* ===== HEADER ===== */
.header{
  position:sticky;
  top:0;
  z-index:100;
  padding:18px 24px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:18px;
  box-shadow:0 8px 30px rgba(79,70,229,0.25);
  backdrop-filter:blur(12px);
}

.header h2{
  margin:0;
  font-size:28px;
  font-weight:800;
  letter-spacing:-0.5px;
  display:flex;
  align-items:center;
  gap:10px;
}

/* ===== BACK BUTTON (LEFT SIDE) ===== */
.back-btn{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.18);
  color:#ffffff;
  border:1px solid rgba(255,255,255,0.25);
  padding:10px 18px;
  border-radius:14px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:all .25s ease;
  backdrop-filter:blur(8px);
  white-space:nowrap;
}

.back-btn:hover{
  background:#ffffff;
  color:#4f46e5;
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.back-btn:active{
  transform:translateY(0);
}

/* ===== MESSAGE ===== */
.msg{
  margin:20px 24px 0;
  padding:16px 20px;
  border-radius:16px;
  display:none;
  font-weight:600;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.msg.success{
  background:linear-gradient(135deg,#dcfce7,#bbf7d0);
  color:#166534;
  border:1px solid #86efac;
}

.msg.error{
  background:linear-gradient(135deg,#fee2e2,#fecaca);
  color:#991b1b;
  border:1px solid #fca5a5;
}

/* ===== CONTAINER ===== */
.container{
  padding:28px 24px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:24px;
  max-width:1400px;
  margin:0 auto;
}

/* ===== CARD ===== */
.card{
  background:rgba(255,255,255,0.95);
  border:1px solid rgba(255,255,255,0.8);
  border-radius:28px;
  padding:26px;
  box-shadow:
    0 20px 40px rgba(79,70,229,0.08),
    0 8px 16px rgba(0,0,0,0.06);
  transition:all .3s ease;
  backdrop-filter:blur(12px);
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:
    0 28px 60px rgba(79,70,229,0.12),
    0 12px 24px rgba(0,0,0,0.08);
}

.card h3{
  margin:0 0 18px;
  font-size:24px;
  font-weight:800;
  color:#111827;
  line-height:1.3;
}

.card p{
  margin:10px 0;
  font-size:15px;
  line-height:1.6;
  color:#374151;
}

.card b{
  color:#111827;
}

/* ===== SMALL TEXT ===== */
small{
  color:#6b7280;
  font-size:13px;
}

/* ===== LIST ===== */
.card ul{
  margin:8px 0 16px;
  padding-left:22px;
}

.card li{
  margin-bottom:8px;
  color:#4b5563;
  line-height:1.5;
}

/* ===== BADGES ===== */
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  margin-top:10px;
  letter-spacing:0.3px;
  text-transform:uppercase;
}

.pending{
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  color:#92400e;
  border:1px solid #fcd34d;
}

.approved{
  background:linear-gradient(135deg,#dcfce7,#bbf7d0);
  color:#166534;
  border:1px solid #86efac;
}

/* ===== APPROVE BUTTON (SAME LOGIN/SIGNUP STYLE) ===== */
.approve-btn{
  margin-top:18px;
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px 20px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#ffffff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:all .25s ease;
  box-shadow:0 10px 24px rgba(79,70,229,0.25);
}

.approve-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 32px rgba(79,70,229,0.35);
}

.approve-btn:active{
  transform:translateY(0);
}

.approve-btn:disabled{
  opacity:0.65;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

/* ===== EMPTY STATE ===== */
.container > p{
  grid-column:1 / -1;
  text-align:center;
  background:#ffffff;
  padding:50px 24px;
  border-radius:24px;
  font-size:20px;
  font-weight:700;
  color:#6b7280;
  box-shadow:0 15px 35px rgba(0,0,0,0.08);
}

/* ===== MOBILE ===== */
@media (max-width:768px){
  .header{
    padding:16px;
    gap:12px;
  }

  .header h2{
    font-size:20px;
  }

  .back-btn{
    padding:9px 14px;
    font-size:13px;
  }

  .container{
    padding:20px 16px 30px;
    grid-template-columns:1fr;
    gap:18px;
  }

  .card{
    padding:22px 18px;
    border-radius:22px;
  }

  .card h3{
    font-size:21px;
  }

  .approve-btn{
    padding:13px 18px;
    font-size:14px;
  }

  .msg{
    margin:16px;
  }
}

@media (max-width:480px){
  .header h2{
    font-size:18px;
  }

  .back-btn{
    padding:8px 12px;
    font-size:12px;
  }

  .card h3{
    font-size:19px;
  }
}
  /* =========================================
   APPROVAL CARD HIGHLIGHT
========================================= */

.highlight-card{

  border:2px solid #4f46e5 !important;

  background:
  linear-gradient(135deg,#eef2ff,#ede9fe);

  box-shadow:
  0 0 0 4px rgba(79,70,229,.18),
  0 18px 40px rgba(79,70,229,.28);

  animation:highlightPulse 2s ease-in-out infinite;
}

@keyframes highlightPulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.02);
}

100%{
transform:scale(1);
}

}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
     <button class="back-btn" onclick="location.href='admin-dashboard.html'">
    Back
  </button>
  <h2>Pending Approval Requests</h2>
</div>

<div id="message" class="msg"></div>

<div class="container" id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth,
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot,
  doc,
  updateDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
  authDomain:"sadri-villa-14c06.firebaseapp.com",
  projectId:"sadri-villa-14c06"
});
const auth = getAuth(app);
const db = getFirestore(app);

/* =========================================
   HIGHLIGHT FROM URL
========================================= */

const urlParams = new URLSearchParams(window.location.search);

const highlightApprovalId =
urlParams.get("highlight");

/* ADMIN CHECK */
onAuthStateChanged(auth, async user=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists() || snap.data().role!=="admin"){
    alert("Access denied");
    location.href="dashboard.html";
    return;
  }

  initRealtimeRequests();
});

/* REALTIME REQUESTS */
function initRealtimeRequests(){

const q = query(
  collection(db,"users"),
  where("approved","==",false)
);

  onSnapshot(q, snapshot=>{
    list.innerHTML="";

    if(snapshot.empty){
      list.innerHTML="<p>No pending approval requests 🎉</p>";
      return;
    }

    snapshot.forEach(docSnap=>{
      const u = {id:docSnap.id,...docSnap.data()};

      const card = document.createElement("div");
card.className = "card";
card.id = `approval-${u.id}`;
  card.innerHTML=`
  <h3>${u.fullName || "User"}</h3>

  <p><b>Email:</b> ${u.email || "—"}</p>
<p><b>Mobile:</b> ${u.phone || "—"}</p>

<p><b>Created At:</b> ${
  u.createdAt
    ? new Date(u.createdAt).toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        dateStyle: "medium",
        timeStyle: "short"
      })
    : "—"
}</p>

  ${u.approvalRequests && u.approvalRequests.length > 0 
    ? `
    <p><small><b>Approval Requests:</b></small></p>
    <ul style="padding-left:18px;margin-top:5px;">
      ${u.approvalRequests.map((time,i)=>`
        <li>
          ${i+1}️⃣ 
          ${new Date(time).toLocaleString("en-IN",{
            timeZone:"Asia/Kolkata",
            dateStyle:"medium",
            timeStyle:"short"
          })}
        </li>
      `).join("")}
    </ul>
    `
    : "<p><small>No request history</small></p>"
  }

  <span class="badge pending">Pending</span><br>

  <button class="approve-btn"
    onclick="approveUser('${u.id}','${u.fullName || "User"}',this)">
    Approve
  </button>
`;
      list.appendChild(card);

/* =========================================
   AUTO HIGHLIGHT CARD
========================================= */

if (
    highlightApprovalId &&
    highlightApprovalId === u.id
){

    setTimeout(()=>{

        card.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

        card.classList.add("highlight-card");

        setTimeout(()=>{

            card.classList.remove("highlight-card");

        },5000);

    },300);

}
    });
  });
}

/* APPROVE */
window.approveUser = async (uid,name,btn)=>{
  btn.disabled=true;

 await updateDoc(doc(db,"users",uid),{
  approved:true,
  approvalReminder:false,
  approvedAt:new Date().toISOString()
});

  showMessage(`✅ User <b>${name}</b> approved successfully`);
};

/* MESSAGE */
function showMessage(text){
  message.innerHTML=text;
  message.className="msg success";
  message.style.display="block";

  setTimeout(()=>{
    message.style.display="none";
  },4000);
}
</script>

</body>
</html>
