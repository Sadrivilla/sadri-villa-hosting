<head>

<style>

button{

<h2>Team Admin Panel</h2>
</div>

<div class="form">

<div id="list" class="list"></div>

position:fixed;
bottom:20px;
right:20px;

color:white;
padding:12px 20px;
border-radius:8px;
display:none;
font-weight:bold;
z-index:999;

  <script>
    function formatText(btn, command){
const editor = btn.parentElement.nextElementSibling;
editor.focus();
document.execCommand(command, false, null);
}

function changeColor(select){
const editor = select.parentElement.nextElementSibling;
editor.focus();
document.execCommand("foreColor", false, select.value);
}

function changeFontSize(select){
const editor = select.parentElement.nextElementSibling;
editor.focus();
document.execCommand("fontSize", false, select.value);
}
    let counter = 0;

function addDesc(){
counter++;

const div = document.createElement("div");
div.classList.add("draggable");
div.draggable = true;
div.innerHTML = `

<div style="margin-bottom:8px; display:flex; gap:5px; flex-wrap:wrap;">
<button type="button" onclick="removeBlock(this)" style="background:red;color:white;">❌</button>
<button type="button" onclick="formatText(this,'bold')">B</button>
<button type="button" onclick="formatText(this,'italic')">I</button>
<button type="button" onclick="formatText(this,'underline')">U</button>

<select onchange="changeColor(this)">
<option value="">Color</option>
<option value="#ef4444">Red</option>
<option value="#22c55e">Green</option>
<option value="#3b82f6">Blue</option>
<option value="#eab308">Yellow</option>
<option value="#a855f7">Purple</option>
<option value="#ec4899">Pink</option>
<option value="#14b8a6">Teal</option>
<option value="#f97316">Orange</option>
<option value="#000000">Black</option>
</select>
<select onchange="changeFontSize(this)">
<option value="">Size</option>
<option value="1">Small</option>
<option value="3">Normal</option>
<option value="5">Large</option>
<option value="7">Extra Large</option>
</select>

<button type="button" onclick="formatText(this,'justifyLeft')">⬅</button>
<button type="button" onclick="formatText(this,'justifyCenter')">⬇</button>
<button type="button" onclick="formatText(this,'justifyRight')">➡</button>


</div>

<div class="descInput" contenteditable="true" style="
min-height:80px;
background:white;
color:black;
padding:10px;
border-radius:8px;
"></div>

`;

document.getElementById("multiDesc").appendChild(div);
}

function addProfileImage() {
  // Allow only one profile image
  const existing = document.querySelector('#multiDesc .profile-image-block');

  if (existing) {
    showToast('Only one profile image is allowed.', true);
    return;
  }

  addImage('profile');
}

function addBodyImage() {
  addImage('body');
}

function addImage(imageType = 'body') {
counter++;

const div = document.createElement("div");
div.classList.add("draggable");
div.classList.add(imageType === 'profile' ? 'profile-image-block' : 'body-image-block');
div.dataset.imageType = imageType;
div.draggable = true;

div.innerHTML = `
<div style="margin-bottom:8px;font-weight:bold;color:#38bdf8;">
  ${imageType === 'profile' ? 'Profile Image' : 'Body Image'}
</div>

${imageType === 'profile' ? `
<div class="profile-controls" style="
  margin:10px 0;
  padding:10px;
  background:#1e293b;
  border-radius:8px;
  font-size:12px;
">
  <label>X Position</label>
  <input type="range" class="profileX" min="0" max="100" value="50">

  <label>Y Position</label>
  <input type="range" class="profileY" min="0" max="100" value="50">

  <label>Zoom</label>
  <input type="range" class="profileZoom" min="0.3" max="10" step="0.01" value="1">
</div>
` : ""}
<button type="button" onclick="removeBlock(this)" style="background:red;color:white;">❌</button>
<input type="file" class="imgInput">
<br>
<img
  style="
    display:none;
    max-width:100%;
    width:auto;
    height:auto;
    margin-top:10px;
    border-radius:8px;
    border:2px solid #334155;
    background:white;
  "
>
`;

const input = div.querySelector(".imgInput");
const img = div.querySelector("img");

input.onchange = async () => {
  const file = input.files[0];
  if (!file) return;

  // Crop and resize
  const resizedBlob = await cropResizeImage(file, 1672, 941);

  // Save resized file for upload
  input.resizedFile = new File(
    [resizedBlob],
    file.name,
    { type: "image/jpeg" }
  );

  // Remove old preview URL
  if (img.dataset.objectUrl) {
    URL.revokeObjectURL(img.dataset.objectUrl);
  }

  // Create preview URL
  const previewUrl = URL.createObjectURL(resizedBlob);
  img.dataset.objectUrl = previewUrl;

  // Show preview only after image loads
  img.onload = () => {
    img.style.display = "block";
  };

  img.src = previewUrl;
};

document.getElementById("multiDesc").appendChild(div);

// Apply live profile image controls
if (imageType === 'profile') {
  const xSlider = div.querySelector('.profileX');
  const ySlider = div.querySelector('.profileY');
  const zoomSlider = div.querySelector('.profileZoom');

  function updateProfilePreview() {
    const x = xSlider.value;
    const y = ySlider.value;
    const zoom = zoomSlider.value;

    img.style.objectFit = 'cover';
    img.style.objectPosition = `${x}% ${y}%`;
    img.style.transform = `scale(${zoom})`;
    img.style.transformOrigin = 'center center';
    img.style.width = '220px';
    img.style.height = '220px';
    img.style.borderRadius = '50%';
  }

  xSlider.addEventListener('input', updateProfilePreview);
  ySlider.addEventListener('input', updateProfilePreview);
  zoomSlider.addEventListener('input', updateProfilePreview);

  // Apply default values immediately
  updateProfilePreview();
}
}
function showToast(message, isError=false){
const toast = document.getElementById("toast");

toast.innerText = message;
toast.style.background = isError ? "#ef4444" : "#22c55e";
toast.style.display = "block";

setTimeout(()=>{
toast.style.display = "none";
},3000);
}
      function removeBlock(btn){
btn.parentElement.remove();
}
function previewMember() {
  const contentBlocks = [];
  const blocks = document.getElementById("multiDesc").children;

  for (const block of blocks) {
    const descInput = block.querySelector(".descInput");
    const img = block.querySelector("img");

    // TEXT BLOCK
    if (descInput) {
      const html = descInput.innerHTML.trim();

      if (html && html !== "<br>") {
        contentBlocks.push({
          type: "text",
          text: html
        });
      }
    }

    // IMAGE BLOCK
    if (img && img.src && img.style.display !== "none") {
      const imageData = {
        type: "image",
        imageType: block.dataset.imageType || "body",
        url: img.src
      };

      // Profile image crop settings
      if (imageData.imageType === "profile") {
        imageData.positionX = Number(
          block.querySelector(".profileX")?.value || 50
        );

        imageData.positionY = Number(
          block.querySelector(".profileY")?.value || 50
        );

        imageData.zoom = Number(
          block.querySelector(".profileZoom")?.value || 1
        );
      }

      contentBlocks.push(imageData);
    }
  }

  const previewData = {
    name: document.getElementById("name").value.trim() || "Preview Name",
    role: document.getElementById("role").value.trim() || "",
   facebook: document.getElementById("facebook").value.trim() || "",
instagram: document.getElementById("instagram").value.trim() || "",
linkedin: document.getElementById("linkedin").value.trim() || "",
youtube: document.getElementById("youtube").value.trim() || "",
snapchat: document.getElementById("snapchat").value.trim() || "",
telegram: document.getElementById("telegram").value.trim() || "",
quora: document.getElementById("quora").value.trim() || "",
x: document.getElementById("x").value.trim() || "",
pinterest: document.getElementById("pinterest").value.trim() || "",
    nameStyle: document.getElementById("nameStyle").value || "simple",
    nameSize: Number(
      document.getElementById("nameSize").value || 16
    ),
    contentBlocks
  };

  // Save preview data to browser storage
  localStorage.setItem(
    "previewMemberData",
    JSON.stringify(previewData)
  );

  // Open preview page
  window.open("/team-preview.html", "_blank");
}
</script>
<script type="module">

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = initializeApp({
apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
authDomain:"sadri-villa-14c06.firebaseapp.com",
  projectId:"sadri-villa-14c06",
storageBucket:"sadri-villa-14c06.firebasestorage.app" // ✅ FIXED
});

const db = getFirestore(app);
const storage = getStorage(app);
const functions = getFunctions(app, "us-central1");
  
let editId = null;
  let oldImageUrls = [];

/* SAVE / ADD */
window.saveMember = async function(){
  document.getElementById("saveBtn").innerText="Saving...";
  document.getElementById("progressBox").style.display = "block";
document.getElementById("progressBar").style.width = "0%";
document.getElementById("progressText").innerText = "0%";
document.getElementById("saveBtn").disabled=true;
  const name = document.getElementById("name").value.trim();
const order = document.getElementById("order").value;
const hasContent = document.getElementById("multiDesc").children.length > 0;

if (!name || order === "" || !hasContent) {
showToast("Name, Order and at least one block is required", true);

document.getElementById("progressBox").style.display = "none";
document.getElementById("saveBtn").innerText="Save Member";
document.getElementById("saveBtn").disabled=false;

return;
}

try{
let contentBlocks = [];

const blocks = document.getElementById("multiDesc").children;

let index = 0;

for(let block of blocks){
  if(!block.querySelector(".descInput") && !block.querySelector(".imgInput")){
continue;
}

let descInput = block.querySelector(".descInput");
let fileInput = block.querySelector(".imgInput");

let imageUrl = "";
if(fileInput && (fileInput.resizedFile || fileInput.files[0])){

  const storageRef = ref(storage,"team/"+Date.now()+"_"+index);
  const uploadTask = uploadBytesResumable(storageRef,fileInput.resizedFile || fileInput.files[0]);

  await new Promise((resolve,reject)=>{
    uploadTask.on("state_changed",
      (snapshot)=>{
        let percent = ((index + (snapshot.bytesTransferred / snapshot.totalBytes)) / blocks.length) * 100;

        document.getElementById("progressBar").style.width = percent + "%";
        document.getElementById("progressText").innerText = Math.round(percent) + "%";
      },
      reject,
      async ()=>{
        imageUrl = await getDownloadURL(uploadTask.snapshot.ref);
        resolve();
      }
    );
  });

}else{
  // ✅ KEEP EXISTING IMAGE (EDIT MODE)
  imageUrl = block.querySelector("img")?.src || "";
}

// TEXT BLOCK
if (descInput) {
  const html = descInput.innerHTML.trim();

  if (html && html !== "<br>") {
    contentBlocks.push({
      type: "text",
      text: html
    });
  }
}

// IMAGE BLOCK
if (imageUrl) {
  const imageData = {
    type: "image",
    imageType: block.dataset.imageType || "body",
    url: imageUrl
  };

  // Save profile image crop settings
  if (imageData.imageType === "profile") {
    imageData.positionX =
      Number(block.querySelector(".profileX")?.value || 50);

    imageData.positionY =
      Number(block.querySelector(".profileY")?.value || 50);

    imageData.zoom =
      Number(block.querySelector(".profileZoom")?.value || 1);
  }

  contentBlocks.push(imageData);
}

index++;
}



// ✅ SAFE DATA (NO UNDEFINED)
const data = { 
name: name,
 slug: name
  .toLowerCase()
  .trim()
  .replace(/[^a-z0-9\s-]/g, "")
  .replace(/\s+/g, "-")
  .replace(/-+/g, "-"),
role: document.getElementById("role").value || "",
contentBlocks: contentBlocks,
facebook: document.getElementById("facebook").value || "",
instagram: document.getElementById("instagram").value || "",
linkedin: document.getElementById("linkedin").value || "",
youtube: document.getElementById("youtube").value || "",
snapchat: document.getElementById("snapchat").value || "",
telegram: document.getElementById("telegram").value || "",
quora: document.getElementById("quora").value || "",
x: document.getElementById("x").value || "",
pinterest: document.getElementById("pinterest").value || "",
order: Number(order),
nameStyle: document.getElementById("nameStyle").value || "simple",
nameSize: Number(document.getElementById("nameSize").value || 16),
enabled: true
};
  // Remove null and empty values
data.contentBlocks =
  (data.contentBlocks || []).filter((item) => {
    if (!item || !item.type) return false;

    if (item.type === "text") {
      return item.text && item.text.trim();
    }

    if (item.type === "image") {
      return item.url && String(item.url).trim();
    }

    return false;
  });
  const newImageUrls = data.contentBlocks
  .filter(item => item.type === "image")
  .map(item => item.url);

const removedImageUrls = oldImageUrls.filter(
  url => !newImageUrls.includes(url)
);


// ✅ ADD / UPDATE
let docRef;

if (editId) {
  await updateDoc(doc(db, "team", editId), data);
  docRef = { id: editId };
} else {
  docRef = await addDoc(collection(db, "team"), data);
  editId = docRef.id;
}
  // Generate physical HTML page in GitHub
// Generate physical HTML page in GitHub
const generateMemberPage = httpsCallable(functions, "generateMemberPage");

// Final safe memberId
const finalMemberId = editId || (docRef && docRef.id);

console.log("finalMemberId =", finalMemberId);

if (!finalMemberId) {
  throw new Error("memberId is empty");
}

await generateMemberPage({
  memberId: finalMemberId
});

console.log("Physical HTML page generated successfully.");

// Delete removed images from Firebase Storage
if (removedImageUrls.length > 0) {
  const deleteStorageImages = httpsCallable(

    "deleteStorageImages"
  );

  await deleteStorageImages({
    imageUrls: removedImageUrls
  });

  console.log(
    removedImageUrls.length,
    "removed image(s) deleted from Storage."
  );
}

clearForm();

showToast("Member saved successfully!");

document.getElementById("saveBtn").innerText = "Save Member";
document.getElementById("saveBtn").disabled = false;

}catch(e){
console.error("generateMemberPage error:", e);

alert(
  "Generate Member Page Error:\n\n" +
  (e.details || e.message || JSON.stringify(e))
);

showToast(e.details || e.message || "Unknown error", true);

document.getElementById("progressBox").style.display = "none";
document.getElementById("saveBtn").innerText = "Save Member";
document.getElementById("saveBtn").disabled = false;
}


};

function clearForm(){
[
  "name",
  "role",
  "facebook",
  "instagram",
  "linkedin",
  "youtube",

  "telegram",
  "quora",

// clear dynamic blocks

}

`;

});

/* EDIT */
window.edit = async function(id){
const snap = await getDoc(doc(db,"team",id));
const d = snap.data();
  oldImageUrls = (d.contentBlocks || [])
  .filter(item => item.type === "image" && item.url)
  .map(item => item.url);

editId = id;

// basic fields
document.getElementById("name").value = d.name || "";
document.getElementById("role").value = d.role || "";
document.getElementById("facebook").value = d.facebook || "";
document.getElementById("instagram").value = d.instagram || "";
document.getElementById("linkedin").value = d.linkedin || "";

document.getElementById("x").value = d.x || "";

if (Array.isArray(d.contentBlocks) && d.contentBlocks.length > 0) {

      const editors = document.querySelectorAll(".descInput");

    // IMAGE BLOCK
    if (block.type === "image") {
  if (block.imageType === "profile") {
    addProfileImage();
  } else {
    addBodyImage();
  }

      const previews = document.querySelectorAll("#multiDesc img");
      const lastPreview = previews[previews.length - 1];

lastPreview.src = block.url || "";
lastPreview.style.display = "block";

// Restore profile image controls
if (block.imageType === "profile") {
  const profileBlock =
    lastPreview.closest(".profile-image-block");

  if (profileBlock) {
    const xSlider = profileBlock.querySelector(".profileX");
    const ySlider = profileBlock.querySelector(".profileY");
    const zoomSlider =
      profileBlock.querySelector(".profileZoom");

    if (xSlider) xSlider.value = block.positionX ?? 50;
    if (ySlider) ySlider.value = block.positionY ?? 50;
    if (zoomSlider) zoomSlider.value = block.zoom ?? 1;

    // Reapply crop visually
    lastPreview.style.objectFit = "cover";
    lastPreview.style.objectPosition =
      `${xSlider.value}% ${ySlider.value}%`;
    lastPreview.style.transform =
      `scale(${zoomSlider.value})`;
    lastPreview.style.transformOrigin =
      "center center";
    lastPreview.style.width = "220px";
    lastPreview.style.height = "220px";
    lastPreview.style.borderRadius = "50%";
  }
}
    }
  }
}

// Backward compatibility for old members
else {

    if (d.descriptions[i]) {

      const editors = document.querySelectorAll(".descInput");

        d.descriptions[i].text || "";
    }

    if (d.images[i]) {
      addImage();

      const previews = document.querySelectorAll("#multiDesc img");
      const lastPreview = previews[previews.length - 1];

      lastPreview.src = d.images[i];
      lastPreview.style.display = "block";
    }
  }
}

window.del = async function(id){
  if (!confirm("Delete this member?")) return;

  // Read member data first
  const snap = await getDoc(doc(db, "team", id));
  const data = snap.data() || {};

  // Collect all image URLs
  const imageUrls = (data.contentBlocks || [])
    .filter(item => item.type === "image" && item.url)
    .map(item => item.url);

  // Delete images from Firebase Storage
  if (imageUrls.length > 0) {
    const deleteStorageImages = httpsCallable(
      functions,
      "deleteStorageImages"
    );

    await deleteStorageImages({
      imageUrls
    });
  }

  // Delete Firestore document
  await deleteDoc(doc(db, "team", id));

  // Delete generated HTML file from GitHub
  const deleteMemberPage = httpsCallable(
    functions,
    "deleteMemberPage"
  );

  await deleteMemberPage({
    memberId: id
  });

  showToast("Member deleted successfully!");
};

window.cropResizeImage = function(file, targetWidth, targetHeight){
return new Promise(resolve=>{
const img = new Image();
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

img.onload = ()=>{

const imgRatio = img.width / img.height;
const targetRatio = targetWidth / targetHeight;

let sx, sy, sw, sh;

// center crop logic
if(imgRatio > targetRatio){
// wider image → crop sides
sh = img.height;
sw = sh * targetRatio;
sx = (img.width - sw) / 2;
sy = 0;
}else{
// taller image → crop top/bottom
sw = img.width;
sh = sw / targetRatio;
sx = 0;
sy = (img.height - sh) / 2;
}

canvas.width = targetWidth;
canvas.height = targetHeight;

ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetWidth, targetHeight);

canvas.toBlob(blob=>{
resolve(blob);
}, "image/jpeg", 0.85);

};

img.src = URL.createObjectURL(file);
});
};


  let dragItem = null;
  document.addEventListener("dragstart", (e)=>{
  const item = e.target.closest(".draggable");
  if(!item) return;

  // prevent drag when clicking inputs/select
  if(
  e.target.tagName === "INPUT" ||
  e.target.tagName === "SELECT" ||
  e.target.tagName === "BUTTON"
) return;

  dragItem = item;
  item.classList.add("dragging");
});

document.addEventListener("dragend", (e)=>{
  const item = e.target.closest(".draggable");
  if(!item) return;

  item.classList.remove("dragging");
});

document.addEventListener("dragover", (e)=>{
  e.preventDefault();
  if(!dragItem) return;

  const container = document.getElementById("multiDesc");
  const afterElement = getDragAfterElement(container, e.clientY);

  if(afterElement == null){
    container.appendChild(dragItem);
  }else{
    container.insertBefore(dragItem, afterElement);
  }
});

function getDragAfterElement(container, y){
  const elements = [...container.querySelectorAll(".draggable:not(.dragging)")];

  return elements.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;

    if(offset < 0 && offset > closest.offset){
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}
