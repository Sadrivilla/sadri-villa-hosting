<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Admin</title>

<style>
.draggable {
  border: 1px dashed #64748b;
  padding: 10px;
  margin-bottom: 15px;
  cursor: grab;
  background:#020617;
  border-radius:8px;
}
  .draggable:hover {
  border-color: #38bdf8;
}
.dragging {
  opacity: 0.5;
}
body{
margin:0;
font-family:Arial;
background:#081634;
color:white;
}

/* HEADER */
.header{
padding:20px;
text-align:center;
background:#020617;
}

/* FORM */
.form{
max-width:700px;
margin:30px auto;
background:#0f172a;
padding:25px;
border-radius:15px;
}

input,textarea{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.btn-primary{
background:linear-gradient(135deg,#38bdf8,#60a5fa);
color:white;
width:100%;
}

.btn-small{
padding:6px 10px;
margin:2px;
font-size:12px;
}

.edit{background:#38bdf8;color:white}
.delete{background:red;color:white}
.toggle{background:#22c55e;color:white}
.disable{background:#64748b;color:white}

/* LIST */
.list{
max-width:1000px;
margin:30px auto;
}

.card{
background:#0f172a;
padding:15px;
margin:10px 0;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.info{
flex:1;
}

.controls{
display:flex;
gap:5px;
flex-wrap:wrap;
}
</style>
</head>

<body>

<div class="header">
<h2>Team Admin Panel</h2>
</div>

<div class="form">
<input id="name" placeholder="Name">
<input id="role" placeholder="Role">
  <select id="nameStyle">
<option value="simple">Simple</option>
<option value="bold">Bold</option>
<option value="elegant">Elegant</option>
</select>

<input id="nameSize" type="number" placeholder="Name Size (e.g. 18)">
<div id="multiDesc"></div>

<button type="button" onclick="addDesc()">+ Add Description</button>
<button type="button" onclick="addImage()">+ Add Photo</button>
</div>
<input id="facebook" placeholder="Facebook URL">
<input id="instagram" placeholder="Instagram URL">
<input id="linkedin" placeholder="LinkedIn URL">

<input id="order" type="number" placeholder="Order (0,1,2...)">


<button type="button" onclick="previewMember()" class="btn-primary" style="margin-bottom:10px;background:#22c55e;">
Preview 👁
</button>

<button id="saveBtn" class="btn-primary">Save Member</button>
  <div id="progressBox" style="display:none;margin-top:10px;">
  <div style="background:#1e293b;border-radius:6px;height:10px;overflow:hidden;">
    <div id="progressBar" style="height:10px;width:0%;background:#38bdf8;"></div>
  </div>
  <p id="progressText" style="margin-top:5px;font-size:12px;">0%</p>
</div>
</div>

<div id="list" class="list"></div>
  <div id="toast" style="
position:fixed;
bottom:20px;
right:20px;
background:#22c55e;
color:white;
padding:12px 20px;
border-radius:8px;
display:none;
font-weight:bold;
z-index:999;
"></div>
  <script>
    function formatText(btn, command){
const editor = btn.parentElement.nextElementSibling;
editor.focus();
document.execCommand(command, false, null);
}

function changeColor(select){
const editor = select.parentElement.nextElementSibling;
editor.focus();
document.execCommand("foreColor", false, select.value);
}

function changeFontSize(select){
const editor = select.parentElement.nextElementSibling;
editor.focus();
document.execCommand("fontSize", false, select.value);
}
    let counter = 0;

function addDesc(){
counter++;

const div = document.createElement("div");
div.classList.add("draggable");
div.draggable = true;
div.innerHTML = `

<div style="margin-bottom:8px; display:flex; gap:5px; flex-wrap:wrap;">
<button type="button" onclick="removeBlock(this)" style="background:red;color:white;">❌</button>
<button type="button" onclick="formatText(this,'bold')">B</button>
<button type="button" onclick="formatText(this,'italic')">I</button>
<button type="button" onclick="formatText(this,'underline')">U</button>

<select onchange="changeColor(this)">
<option value="">Color</option>
<option value="#ef4444">Red</option>
<option value="#22c55e">Green</option>
<option value="#3b82f6">Blue</option>
<option value="#eab308">Yellow</option>
<option value="#a855f7">Purple</option>
<option value="#ec4899">Pink</option>
<option value="#14b8a6">Teal</option>
<option value="#f97316">Orange</option>
<option value="#000000">Black</option>
</select>
<select onchange="changeFontSize(this)">
<option value="">Size</option>
<option value="1">Small</option>
<option value="3">Normal</option>
<option value="5">Large</option>
<option value="7">Extra Large</option>
</select>

<button type="button" onclick="formatText(this,'justifyLeft')">⬅</button>
<button type="button" onclick="formatText(this,'justifyCenter')">⬇</button>
<button type="button" onclick="formatText(this,'justifyRight')">➡</button>


</div>

<div class="descInput" contenteditable="true" style="
min-height:80px;
background:white;
color:black;
padding:10px;
border-radius:8px;
"></div>

`;

document.getElementById("multiDesc").appendChild(div);
}


function addImage(){
counter++;

const div = document.createElement("div");
div.classList.add("draggable");
div.draggable = true;

div.innerHTML = `
<button type="button" onclick="removeBlock(this)" style="background:red;color:white;">❌</button>
<input type="file" class="imgInput">
<img style="max-width:200px;border-radius:8px;margin-top:5px;display:none;">
`;

const input = div.querySelector(".imgInput");
const img = div.querySelector("img");

input.onchange = async ()=>{
const file = input.files[0];
if(!file) return;

// crop + resize (NO STRETCH)
const resizedBlob = await cropResizeImage(file, 1672, 941);

// preview
img.src = URL.createObjectURL(resizedBlob);
img.style.display = "block";

// store resized file
input.resizedFile = new File([resizedBlob], file.name, { type: "image/jpeg" });
};

document.getElementById("multiDesc").appendChild(div);
}
function showToast(message, isError=false){
const toast = document.getElementById("toast");

toast.innerText = message;
toast.style.background = isError ? "#ef4444" : "#22c55e";
toast.style.display = "block";

setTimeout(()=>{
toast.style.display = "none";
},3000);
}
      function removeBlock(btn){
btn.parentElement.remove();
}
    function previewMember(){

const name = document.getElementById("name").value || "Preview Name";
const role = document.getElementById("role").value || "";

const blocks = document.getElementById("multiDesc").children;

let html = `
<!DOCTYPE html>
<html>
<head>
<title>${name}</title>
<style>
body{
font-family:Arial;
padding:20px;
background:#f1f5f9;
}
img{
max-width:100%;
border-radius:10px;
margin:10px 0;
}
</style>
</head>
<body>

<h1 style="
font-size:${document.getElementById("nameSize").value || 16}px;
font-weight:${document.getElementById("nameStyle").value === "bold" ? "700" : "400"};
font-family:${document.getElementById("nameStyle").value === "elegant" ? "serif" : "Arial"};
">
${name}
</h1>
<h2>${role}</h2>
`;

for(let block of blocks){

let descInput = block.querySelector(".descInput");
let img = block.querySelector("img");

// TEXT
if(descInput){
html += `<div style="margin-bottom:10px;">${descInput.innerHTML}</div>`;
}

// IMAGE
if(img && img.src && !img.src.includes("blob:") && img.style.display !== "none"){
html += `<img src="${img.src}">`;
}

}

html += `</body></html>`;

// open preview in new tab
const newWindow = window.open("", "_blank");
newWindow.document.write(html);
newWindow.document.close();

}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
  getFunctions,
  httpsCallable
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = initializeApp({
apiKey:"AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",
authDomain:"sadri-villa-14c06.firebaseapp.com",
  projectId:"sadri-villa-14c06",
storageBucket:"sadri-villa-14c06.firebasestorage.app" // ✅ FIXED
});

const db = getFirestore(app);
const storage = getStorage(app);
const functions = getFunctions(app, "us-central1");
  
let editId = null;

/* SAVE / ADD */
window.saveMember = async function(){
  document.getElementById("saveBtn").innerText="Saving...";
  document.getElementById("progressBox").style.display = "block";
document.getElementById("progressBar").style.width = "0%";
document.getElementById("progressText").innerText = "0%";
document.getElementById("saveBtn").disabled=true;
  const name = document.getElementById("name").value.trim();
const order = document.getElementById("order").value;
const hasContent = document.getElementById("multiDesc").children.length > 0;

if(!name || !order || !hasContent){
showToast("Name, Order and at least one block is required", true);

document.getElementById("progressBox").style.display = "none";
document.getElementById("saveBtn").innerText="Save Member";
document.getElementById("saveBtn").disabled=false;

return;
}

try{
let descriptions = [];
let images = [];

const blocks = document.getElementById("multiDesc").children;

let index = 0;

for(let block of blocks){
  if(!block.querySelector(".descInput") && !block.querySelector(".imgInput")){
continue;
}

let descInput = block.querySelector(".descInput");
let fileInput = block.querySelector(".imgInput");

let imageUrl = "";
if(fileInput && (fileInput.resizedFile || fileInput.files[0])){

  const storageRef = ref(storage,"team/"+Date.now()+"_"+index);
  const uploadTask = uploadBytesResumable(storageRef,fileInput.resizedFile || fileInput.files[0]);

  await new Promise((resolve,reject)=>{
    uploadTask.on("state_changed",
      (snapshot)=>{
        let percent = ((index + (snapshot.bytesTransferred / snapshot.totalBytes)) / blocks.length) * 100;

        document.getElementById("progressBar").style.width = percent + "%";
        document.getElementById("progressText").innerText = Math.round(percent) + "%";
      },
      reject,
      async ()=>{
        imageUrl = await getDownloadURL(uploadTask.snapshot.ref);
        resolve();
      }
    );
  });

}else{
  // ✅ KEEP EXISTING IMAGE (EDIT MODE)
  imageUrl = block.querySelector("img")?.src || "";
}

// description
if(descInput){
descriptions.push({
type: "text",
text: descInput.innerHTML
});
images.push(null);
}
 

// image
if(imageUrl){
descriptions.push(null);
images.push(imageUrl);
}

index++;
}



// ✅ SAFE DATA (NO UNDEFINED)
const data = {
name: name,
 slug: name
  .toLowerCase()
  .trim()
  .replace(/[^a-z0-9\s-]/g, "")
  .replace(/\s+/g, "-")
  .replace(/-+/g, "-"),
role: document.getElementById("role").value || "",
descriptions: descriptions,
images: images,
facebook: document.getElementById("facebook").value || "",
instagram: document.getElementById("instagram").value || "",
linkedin: document.getElementById("linkedin").value || "",
order: Number(order),
nameStyle: document.getElementById("nameStyle").value || "simple",
nameSize: Number(document.getElementById("nameSize").value || 16),
enabled: true
};


// ✅ ADD / UPDATE
if(editId){
await updateDoc(doc(db,"team",editId),data);
editId = null;
}else{
await addDoc(collection(db,"team"),data);
}
  // Generate physical HTML page in GitHub
console.log("Skipping member page generation for now.");


  document.getElementById("progressBox").style.display = "none";

clearForm();
  document.getElementById("saveBtn").innerText="Save Member";
document.getElementById("saveBtn").disabled=false;

}catch(e){
console.error(e);
showToast(e.message, true);
  document.getElementById("progressBox").style.display = "none";

document.getElementById("saveBtn").innerText="Save Member";
document.getElementById("saveBtn").disabled=false;
}

};

function clearForm(){
["name","role","facebook","instagram","linkedin","order"]
.forEach(id=>document.getElementById(id).value="");

// clear dynamic blocks
document.getElementById("multiDesc").innerHTML = "";
}

/* LOAD LIST */
const list = document.getElementById("list");

onSnapshot(collection(db,"team"),snap=>{
list.innerHTML="";

let arr=[];
snap.forEach(d=>arr.push({id:d.id,...d.data()}));

// ✅ SAFE SORT
arr.sort((a,b)=>(a.order||0)-(b.order||0));

arr.forEach(d=>{
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="info">
<strong>${d.name || ""}</strong> (${d.role || ""})<br>
Order: ${d.order || 0} | Status: ${d.enabled ? "Active":"Disabled"}
</div>

<div class="controls">
<button class="btn-small edit" onclick="edit('${d.id}')">Edit ✏️</button>
<button class="btn-small ${d.enabled ? "disable":"toggle"}" onclick="toggle('${d.id}',${d.enabled})">
${d.enabled ? "Disable":"Enable"}
</button>
<button class="btn-small delete" onclick="del('${d.id}')">Delete</button>
<button class="btn-small" onclick="move('${d.id}',-1)">⬆</button>
<button class="btn-small" onclick="move('${d.id}',1)">⬇</button>
</div>
`;

list.appendChild(div);
});
});

/* EDIT */
window.edit = async function(id){
const snap = await getDoc(doc(db,"team",id));
const d = snap.data();

editId = id;

// basic fields
document.getElementById("name").value = d.name || "";
document.getElementById("role").value = d.role || "";
document.getElementById("facebook").value = d.facebook || "";
document.getElementById("instagram").value = d.instagram || "";
document.getElementById("linkedin").value = d.linkedin || "";
document.getElementById("order").value = d.order || 0;
  document.getElementById("nameStyle").value = d.nameStyle || "simple";
document.getElementById("nameSize").value = d.nameSize || 16;

// clear old blocks
document.getElementById("multiDesc").innerHTML = "";

// rebuild blocks
for(let i=0; i<(d.descriptions?.length || 0); i++){

// TEXT BLOCK
if(d.descriptions[i]){
addDesc();

const last = document.querySelectorAll(".descInput");
last[last.length-1].innerHTML = d.descriptions[i].text || "";
}

// IMAGE BLOCK
if(d.images[i]){
addImage();

const imgs = document.querySelectorAll(".imgInput");
const previews = document.querySelectorAll("#multiDesc img");

const index = imgs.length - 1;

previews[index].src = d.images[i];
previews[index].style.display = "block";
}
}
};


/* DELETE */
window.del = async id=> await deleteDoc(doc(db,"team",id));

/* TOGGLE */
window.toggle = async (id,status)=>{
await updateDoc(doc(db,"team",id),{enabled:!status});
};

/* MOVE */
window.move = async (id,dir)=>{
const snap = await getDoc(doc(db,"team",id));
let current = snap.data().order || 0;

await updateDoc(doc(db,"team",id),{
order: current + dir
});
};
  const saveBtn = document.getElementById("saveBtn");

saveBtn.addEventListener("click", ()=>{
if(saveBtn.disabled) return;
saveMember();
});
function cropResizeImage(file, targetWidth, targetHeight){
return new Promise(resolve=>{
const img = new Image();
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

img.onload = ()=>{

const imgRatio = img.width / img.height;
const targetRatio = targetWidth / targetHeight;

let sx, sy, sw, sh;

// center crop logic
if(imgRatio > targetRatio){
// wider image → crop sides
sh = img.height;
sw = sh * targetRatio;
sx = (img.width - sw) / 2;
sy = 0;
}else{
// taller image → crop top/bottom
sw = img.width;
sh = sw / targetRatio;
sx = 0;
sy = (img.height - sh) / 2;
}

canvas.width = targetWidth;
canvas.height = targetHeight;

ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetWidth, targetHeight);

canvas.toBlob(blob=>{
resolve(blob);
}, "image/jpeg", 0.85);

};

img.src = URL.createObjectURL(file);
});
}


  let dragItem = null;
  document.addEventListener("dragstart", (e)=>{
  const item = e.target.closest(".draggable");
  if(!item) return;

  // prevent drag when clicking inputs/select
  if(
  e.target.tagName === "INPUT" ||
  e.target.tagName === "SELECT" ||
  e.target.tagName === "BUTTON"
) return;

  dragItem = item;
  item.classList.add("dragging");
});

document.addEventListener("dragend", (e)=>{
  const item = e.target.closest(".draggable");
  if(!item) return;

  item.classList.remove("dragging");
});

document.addEventListener("dragover", (e)=>{
  e.preventDefault();
  if(!dragItem) return;

  const container = document.getElementById("multiDesc");
  const afterElement = getDragAfterElement(container, e.clientY);

  if(afterElement == null){
    container.appendChild(dragItem);
  }else{
    container.insertBefore(dragItem, afterElement);
  }
});

function getDragAfterElement(container, y){
  const elements = [...container.querySelectorAll(".draggable:not(.dragging)")];

  return elements.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;

    if(offset < 0 && offset > closest.offset){
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}
</script>
