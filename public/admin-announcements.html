<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Sadri Villa Admin Announcements
</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#f1f5f9;
font-family:Inter,Arial,sans-serif;
}

.card{
background:white;
border-radius:24px;
box-shadow:
0 10px 30px rgba(0,0,0,.08);
}

.preview-image{
height:180px;
width:180px;
object-fit:cover;
border-radius:16px;
border:1px solid #e2e8f0;
}

.action-btn{
padding:10px 16px;
border-radius:12px;
font-weight:600;
}

</style>

</head>
<body>
  <!-- LOADING -->

<div
id="loadingOverlay"
class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">

<div class="bg-white p-6 rounded-3xl">

<div
class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto">
</div>

<p class="mt-4 font-semibold">
Please wait...
</p>

</div>

</div>

<!-- TOAST -->

<div
id="toast"
class="hidden fixed top-5 right-5 z-50">

<div
id="toastContent"
class="px-5 py-4 rounded-2xl text-white shadow-xl">
</div>

</div>

<!-- DELETE MODAL -->

<div
id="confirmModal"
class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center">

<div class="bg-white rounded-3xl p-6 w-full max-w-md">

<h3 class="text-xl font-bold">
Delete Announcement
</h3>

<p class="text-gray-600 mt-3">
This action cannot be undone.
</p>

<div class="flex justify-end gap-3 mt-6">

<button
id="cancelDelete"
class="px-5 py-2 bg-gray-200 rounded-xl">
Cancel
</button>

<button
id="confirmDelete"
class="px-5 py-2 bg-red-600 text-white rounded-xl">
Delete
</button>

</div>

</div>

</div>
<div class="max-w-7xl mx-auto p-6">

<div class="card p-6">

<div class="flex justify-between items-center mb-6">

<h1 class="text-3xl font-bold">
Announcements Management
</h1>

<input
id="searchInput"
type="text"
placeholder="Search announcement..."
class="border rounded-xl px-4 py-3 w-80">

</div>

<form
id="announcementForm"
class="space-y-4">

<input
id="title"
type="text"
required
placeholder="Announcement Header"
class="w-full border rounded-xl p-3">

<textarea
id="description"
rows="5"
required
placeholder="Announcement Details"
class="w-full border rounded-xl p-3">
</textarea>

<div>

<label class="font-semibold">
Upload Images
</label>

<input
id="images"
type="file"
multiple
accept="image/*"
class="w-full border rounded-xl p-3 mt-2">

</div>

<div
id="existingImagesContainer"
class="flex flex-wrap gap-3 mb-4">
</div>

<div
id="previewContainer"
class="flex flex-wrap gap-3">
</div>

<div class="flex flex-wrap gap-6">

<label class="flex items-center gap-2">

<input
id="enabled"
type="checkbox"
checked>

Enable Announcement

</label>

<label class="flex items-center gap-2">

<input
id="pinned"
type="checkbox">

Pin To Top

</label>

</div>

<button
id="saveBtn"
type="submit"
class="bg-black text-white px-6 py-3 rounded-xl">

Save Announcement

</button>

</form>

</div>

<div
id="announcementList"
class="grid md:grid-cols-2 xl:grid-cols-3 gap-5 mt-8">
</div>

</div>
<script type="module">
import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
serverTimestamp,
getDocs,
query,
orderBy,
deleteDoc,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL,
deleteObject
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
  import {
getAuth
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
sendNotification
}
from "./js/notification-service.js";

/* -----------------------------------
   FIREBASE CONFIG
----------------------------------- */

const firebaseConfig = {

apiKey: "AIzaSyC7gkT4F_dRJpWfef12y6cwV3F2PTMJ6fY",

authDomain: "sadri-villa-14c06.firebaseapp.com",

projectId: "sadri-villa-14c06",

storageBucket: "sadri-villa-14c06.firebasestorage.app",

messagingSenderId: "687608762860",

appId: "1:687608762860:web:5ffdc557f3893d00e530c9"

};

const app =
initializeApp(firebaseConfig);

const storage =
getStorage(app);

const db =
getFirestore(app);
  const auth =
getAuth(app);

console.log(
"Current User:",
auth.currentUser
);

/* -----------------------------------
   IMAGE PREVIEW
----------------------------------- */

const imageInput =
document.getElementById("images");

const previewContainer =
document.getElementById("previewContainer");

imageInput.addEventListener(
"change",
(e)=>{

previewContainer.innerHTML="";

const files =
e.target.files;

if(!files.length) return;

Array.from(files).forEach(file=>{

const reader =
new FileReader();

reader.onload=(event)=>{

const wrapper =
document.createElement("div");

wrapper.className="relative";

wrapper.innerHTML=`
<img
src="${event.target.result}"
class="preview-image">

<div
class="absolute bottom-1 left-1 right-1 bg-black/70 text-white text-xs px-2 py-1 rounded-lg truncate">
${file.name}
</div>
`;

previewContainer.appendChild(
wrapper
);

};

reader.readAsDataURL(file);

});

});

/* -----------------------------------
   LOADER
----------------------------------- */

function showLoader(){

document
.getElementById("loadingOverlay")
.classList.remove("hidden");

}

function hideLoader(){

document
.getElementById("loadingOverlay")
.classList.add("hidden");

}
  /* -----------------------------------
   TOAST
----------------------------------- */

function showToast(
message,
type="success"
){

const toast =
document.getElementById(
"toast"
);

const toastContent =
document.getElementById(
"toastContent"
);

toastContent.textContent =
message;

toastContent.className =
"px-5 py-4 rounded-2xl text-white shadow-xl";

if(type === "success"){

toastContent.classList.add(
"bg-green-600"
);

}
else{

toastContent.classList.add(
"bg-red-600"
);

}

toast.classList.remove(
"hidden"
);

setTimeout(()=>{

toast.classList.add(
"hidden"
);

},3000);

}

/* -----------------------------------
   UPLOAD IMAGES
----------------------------------- */

async function uploadImages(files){

const urls = [];

for(const file of files){

const fileName =
Date.now() +
"-" +
file.name;

const storageRef =
ref(
storage,
"announcement-images/" + fileName
);

await uploadBytes(
storageRef,
file
);

const downloadURL =
await getDownloadURL(
storageRef
);

urls.push(downloadURL);

}

return urls;

}
  /* -----------------------------------
   LOAD ANNOUNCEMENTS
----------------------------------- */

const announcementList =
document.getElementById(
"announcementList"
);
  let allAnnouncements = [];
  let deleteId = null;

let editId = null;
  let existingImages = [];
let removedImages = [];

const saveBtn =
document.getElementById(
"saveBtn"
);

const confirmModal =
document.getElementById(
"confirmModal"
);

const confirmDeleteBtn =
document.getElementById(
"confirmDelete"
);

const cancelDeleteBtn =
document.getElementById(
"cancelDelete"
);

async function loadAnnouncements(){

announcementList.innerHTML =
"Loading...";

const q =
query(
collection(db,"announcements"),
orderBy("pinned","desc"),
orderBy("createdAt","desc")
);

let snapshot;

try{

snapshot =
await getDocs(q);

}
catch(error){

console.error(
"Load Announcements Error:",
error
);

announcementList.innerHTML =
"<div class='text-red-600'>Failed to load announcements.</div>";

return;

}

announcementList.innerHTML="";
  allAnnouncements = [];

snapshot.forEach(documentSnapshot=>{

const data =
documentSnapshot.data();
  allAnnouncements.push({
id: documentSnapshot.id,
...data
});

const docId =
documentSnapshot.id;

const card =
document.createElement("div");

card.className =
"card p-5";

const imagesHtml =
(data.images || [])
.map(url=>`
<img
src="${url}"
class="w-full h-40 object-cover rounded-xl mb-2">
`)
.join("");

card.innerHTML = `

<div class="flex gap-2 mb-3">

<span class="
px-3 py-1 rounded-full text-xs
${data.enabled
? 'bg-green-100 text-green-700'
: 'bg-red-100 text-red-700'}
">

${data.enabled
? 'Enabled'
: 'Disabled'}

</span>

${data.pinned
? `
<span class="
px-3 py-1 rounded-full text-xs
bg-yellow-100 text-yellow-700">
Pinned
</span>
`
: ""}

</div>

<h3 class="text-xl font-bold mb-2">
${data.title}
</h3>

<p class="text-gray-600 mb-4">
${data.description}
</p>

${imagesHtml}

<div class="flex flex-wrap gap-2 justify-end mt-4">

<button
class="toggle-enable-btn bg-blue-600 text-white px-3 py-2 rounded-xl"
data-id="${docId}">
${data.enabled ? "Disable" : "Enable"}
</button>

<button
class="toggle-pin-btn bg-yellow-500 text-white px-3 py-2 rounded-xl"
data-id="${docId}">
${data.pinned ? "Unpin" : "Pin"}
</button>

<button
class="edit-btn bg-green-600 text-white px-3 py-2 rounded-xl"
data-id="${docId}">
Edit
</button>

<button
class="delete-btn bg-red-600 text-white px-3 py-2 rounded-xl"
data-id="${docId}">
Delete
</button>

</div>

`;

announcementList.appendChild(
card
);
card
.querySelector(".edit-btn")
.addEventListener(
"click",
()=>{

editId = docId;

removedImages = [];

existingImages =
[...(data.images || [])];
  previewContainer.innerHTML = "";
imageInput.value = "";
  const existingContainer =
document.getElementById(
"existingImagesContainer"
);

existingContainer.innerHTML = "";

existingImages.forEach(url=>{

const wrapper =
document.createElement("div");

wrapper.className =
"relative";

wrapper.innerHTML = `
<img
src="${url}"
class="preview-image">

<button
type="button"
class="remove-existing-image absolute top-2 right-2 bg-red-600 text-white px-2 py-1 rounded">
X
</button>
`;

wrapper
.querySelector(".remove-existing-image")
.addEventListener(
"click",
()=>{

removedImages.push(url);

existingImages =
existingImages.filter(
img=>img !== url
);

wrapper.remove();

}
);

existingContainer.appendChild(
wrapper
);

});


document.getElementById(
"title"
).value =
data.title || "";

document.getElementById(
"description"
).value =
data.description || "";

document.getElementById(
"enabled"
).checked =
data.enabled || false;

document.getElementById(
"pinned"
).checked =
data.pinned || false;

saveBtn.textContent =
"Update Announcement";

window.scrollTo({
top:0,
behavior:"smooth"
});

}
);
card
.querySelector(".delete-btn")
.addEventListener(
"click",
()=>{

deleteId = docId;

confirmModal
.classList
.remove("hidden");

}
);
  card
.querySelector(".toggle-enable-btn")
.addEventListener(
"click",
async()=>{

showLoader();

try{

await updateDoc(
doc(
db,
"announcements",
docId
),
{
enabled: !data.enabled
}
);

await loadAnnouncements();

}
catch(error){

console.error(error);

alert(error.message);

}

hideLoader();

}
);

card
.querySelector(".toggle-pin-btn")
.addEventListener(
"click",
async()=>{

showLoader();

try{

await updateDoc(
doc(
db,
"announcements",
docId
),
{
pinned: !data.pinned
}
);

await loadAnnouncements();

}
catch(error){

console.error(error);

alert(error.message);

}

hideLoader();

}
);

});

}
  /* -----------------------------------
   DELETE ANNOUNCEMENT
----------------------------------- */

cancelDeleteBtn
.addEventListener(
"click",
()=>{

confirmModal
.classList
.add("hidden");

deleteId = null;

}
);

confirmDeleteBtn
.addEventListener(
"click",
async()=>{

if(!deleteId) return;

const announcementDoc =
await getDoc(
doc(
db,
"announcements",
deleteId
)
);

if(!announcementDoc.exists()){

alert("Announcement not found.");
hideLoader();
return;

}

const announcementData =
announcementDoc.data();

showLoader();

try{

if(
announcementData &&
announcementData.images
){

for(
const imageUrl of
announcementData.images
){

try{

const decodedUrl =
decodeURIComponent(
imageUrl
);

const start =
decodedUrl.indexOf(
"/o/"
) + 3;

const end =
decodedUrl.indexOf(
"?"
);

const filePath =
decodedUrl.substring(
start,
end
);

await deleteObject(
ref(
storage,
filePath
)
);

}
catch(err){

console.error(
"Storage Delete Error:",
err
);

}

}

}

await deleteDoc(
doc(
db,
"announcements",
deleteId
)
);

confirmModal
.classList
.add("hidden");

deleteId = null;

await loadAnnouncements();

showToast(
"Announcement deleted successfully."
);

}
catch(error){

console.error(error);

showToast(
error.message,
"error"
);

}

hideLoader();

}
);

/* -----------------------------------
   TEST SAVE BUTTON
----------------------------------- */

document
.getElementById("announcementForm")
.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const files =
imageInput.files;

showLoader();

try{

let newImageUrls = [];

if(files.length){

newImageUrls =
await uploadImages(files);

}

const announcementData = {

title:
document.getElementById("title").value,

description:
document.getElementById("description").value,

enabled:
document.getElementById("enabled").checked,

pinned:
document.getElementById("pinned").checked,

images:
[
...existingImages,
...newImageUrls
]

};
if(
editId &&
removedImages.length
){

for(
const imageUrl of removedImages
){

try{

const decodedUrl =
decodeURIComponent(
imageUrl
);

const start =
decodedUrl.indexOf("/o/") + 3;

const end =
decodedUrl.indexOf("?");

const filePath =
decodedUrl.substring(
start,
end
);

await deleteObject(
ref(
storage,
filePath
)
);

}
catch(err){

console.error(
"Image Delete Error:",
err
);

}

}

}
if(editId){

await updateDoc(
doc(
db,
"announcements",
editId
),
announcementData
);

}
else{

const announcementRef =
await addDoc(
collection(db,"announcements"),
{
...announcementData,
createdAt: serverTimestamp()
}
);

await sendNotification({

    recipients:"all",

    type:"announcement",

    title:announcementData.title,

    message:announcementData.description,

    url:`/announcements.html?id=${announcementRef.id}`,

    triggeredBy:"Admin"

});
  }


showToast(
"Announcement saved successfully."
);

document
.getElementById("announcementForm")
.reset();
  editId = null;

existingImages = [];

removedImages = [];

saveBtn.textContent =
"Save Announcement";

previewContainer.innerHTML="";
  document.getElementById(
"existingImagesContainer"
).innerHTML = "";

await loadAnnouncements();

}
catch(error){

console.error(error);

alert(
error.message
);

}

hideLoader();

});
  /* -----------------------------------
   SEARCH
----------------------------------- */

const searchInput =
document.getElementById(
"searchInput"
);

searchInput.addEventListener(
"input",
()=>{

const keyword =
searchInput.value
.toLowerCase()
.trim();

const cards =
announcementList.children;

Array.from(cards).forEach(card=>{

const title =
card.querySelector("h3")
?.innerText
.toLowerCase() || "";

const description =
card.querySelector("p")
?.innerText
.toLowerCase() || "";

const text =
title + " " + description;

if(
text.includes(keyword)
){

card.style.display = "";

}
else{

card.style.display = "none";

}

});

}
);
  loadAnnouncements();

</script>

</body>
</html>
