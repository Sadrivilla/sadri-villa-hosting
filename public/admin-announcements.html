<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Sadri Villa Admin Announcements
</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#f1f5f9;
font-family:Inter,Arial,sans-serif;
}

.card{
background:white;
border-radius:24px;
box-shadow:
0 10px 30px rgba(0,0,0,.08);
}

.preview-image{
height:180px;
width:180px;
object-fit:cover;
border-radius:16px;
border:1px solid #e2e8f0;
}

.action-btn{
padding:10px 16px;
border-radius:12px;
font-weight:600;
}

</style>

</head>
<body>
  <!-- LOADING -->

<div
id="loadingOverlay"
class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">

<div class="bg-white p-6 rounded-3xl">

<div
class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto">
</div>

<p class="mt-4 font-semibold">
Please wait...
</p>

</div>

</div>

<!-- TOAST -->

<div
id="toast"
class="hidden fixed top-5 right-5 z-50">

<div
id="toastContent"
class="px-5 py-4 rounded-2xl text-white shadow-xl">
</div>

</div>

<!-- DELETE MODAL -->

<div
id="confirmModal"
class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center">

<div class="bg-white rounded-3xl p-6 w-full max-w-md">

<h3 class="text-xl font-bold">
Delete Announcement
</h3>

<p class="text-gray-600 mt-3">
This action cannot be undone.
</p>

<div class="flex justify-end gap-3 mt-6">

<button
id="cancelDelete"
class="px-5 py-2 bg-gray-200 rounded-xl">
Cancel
</button>

<button
id="confirmDelete"
class="px-5 py-2 bg-red-600 text-white rounded-xl">
Delete
</button>

</div>

</div>

</div>
<div class="max-w-7xl mx-auto p-6">

<div class="card p-6">

<div class="flex justify-between items-center mb-6">

<h1 class="text-3xl font-bold">
Announcements Management
</h1>

<input
id="searchInput"
type="text"
placeholder="Search announcement..."
class="border rounded-xl px-4 py-3 w-80">

</div>

<form
id="announcementForm"
class="space-y-4">

<input
id="title"
type="text"
required
placeholder="Announcement Header"
class="w-full border rounded-xl p-3">

<textarea
id="description"
rows="5"
required
placeholder="Announcement Details"
class="w-full border rounded-xl p-3">
</textarea>

<div>

<label class="font-semibold">
Upload Images
</label>

<input
id="images"
type="file"
multiple
accept="image/*"
class="w-full border rounded-xl p-3 mt-2">

</div>

<div
id="previewContainer"
class="flex flex-wrap gap-3">
</div>

<div class="flex flex-wrap gap-6">

<label class="flex items-center gap-2">

<input
id="enabled"
type="checkbox"
checked>

Enable Announcement

</label>

<label class="flex items-center gap-2">

<input
id="pinned"
type="checkbox">

Pin To Top

</label>

</div>

<button
id="saveBtn"
type="submit"
class="bg-black text-white px-6 py-3 rounded-xl">

Save Announcement

</button>

</form>

</div>

<div
id="announcementList"
class="grid md:grid-cols-2 xl:grid-cols-3 gap-5 mt-8">
</div>

</div>
<script type="module">

// PART 2 CODE WILL COME HERE
  const imageInput =
document.getElementById("images");

const previewContainer =
document.getElementById("previewContainer");

imageInput.addEventListener("change",(e)=>{

previewContainer.innerHTML="";

const files = e.target.files;

if(!files.length) return;

Array.from(files).forEach(file=>{

const reader =
new FileReader();

reader.onload=(event)=>{

const wrapper =
document.createElement("div");

wrapper.className =
"relative";

wrapper.innerHTML = `
<img
src="${event.target.result}"
class="preview-image">

<div
class="absolute bottom-1 left-1 right-1 bg-black/70 text-white text-xs px-2 py-1 rounded-lg truncate">
${file.name}
</div>
`;

previewContainer.appendChild(
wrapper
);

};

reader.readAsDataURL(file);

});

});

</script>

</body>
</html>
